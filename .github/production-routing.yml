version: 4
register_revision: R7
repository: Khaos-Krew/Khaos-Nexus
rules:
  existing_application: true
  inspect_before_planning: true
  exact_baseline_required: true
  preserve_working_systems: true
  preserve_data_and_workflows: true
  no_rewrite_without_evidence: true
  one_primary_owner: true
  secondary_handoffs_only_when_action_required: true
  update_existing_issue_before_creating_duplicate: true
  main_is_not_automatically_application_baseline: true
  assistant_led_development: true
  owner_limited_participation: true
  exhaust_automated_validation_before_owner: true
  owner_questions_only_when_unresolvable_elsewhere: true
  owner_physical_or_private_execution_only: true
  approved_test_distribution_required: true
  owner_final_product_and_release_approval: true
  owner_not_assigned_engineering_or_repository_work: true
  legacy_lovable_website_retired: true
  archived_website_repository_noncanonical: true
  canonical_application_repository_locked: true
  supabase_independent_active_shared_service: true
  website_retirement_does_not_apply_to_supabase: true

sources_of_truth:
  code: Khaos-Krew/Khaos-Nexus
  diagnostics_runtime: Khaos-Krew/Khaos-Nexus-Diagnostics
  decisions: https://docs.google.com/document/d/14lSPuROBAEa8YLe_gPTyyxIiILVik-a0NT_hUkPcYog
  work: github_issues
  implementation: linked_pull_request
  retired_website_repository: Khaos-Krew/chaos-nexus-hub

canonical_repositories:
  application:
    repository: Khaos-Krew/Khaos-Nexus
    status: active
    canonical: true
  diagnostics_runtime:
    repository: Khaos-Krew/Khaos-Nexus-Diagnostics
    status: active_supporting_runtime
    canonical_application: false

retired_surfaces:
  lovable_website:
    status: deleted
    canonical: false
    implementation_source: none
    managed_cloud: lovable_managed
  archived_website_repository:
    repository: Khaos-Krew/chaos-nexus-hub
    status: archived_private_historical_evidence
    canonical: false
    implementation_baseline_allowed: false

active_shared_services:
  supabase:
    project_ref: gcdgcftsjorsubutsamh
    status: active
    role: independent_khaos_nexus_shared_service
    independent_of_lovable_website: true
    website_retirement_applies: false
    approved_use:
      - inspection under an assigned application handoff
      - schema and RLS work under an assigned shared-service scope
      - non-destructive application integration and validation
    safeguards:
      - preserve existing data, schema, authentication, RLS, storage, and integrations
      - do not use the archived website repository as a schema or implementation source
      - destructive lifecycle changes require a separate explicit handoff and Owner approval
    current_consumer_handoffs:
      - 94

responsibility_model:
  production_agents:
    own:
      - repository inspection and current-behavior analysis
      - architecture and implementation planning
      - development, refactoring, and defect repair
      - automated, integration, packaging, artifact, signature, and checksum validation
      - diagnostics, security review, and evidence interpretation
      - GitHub coordination, issue routing, branch and pull-request management
      - release preparation and test-candidate publication requests
      - conversion of Owner observations into structured evidence and follow-up work
    must_not_delegate_to_owner:
      - code edits or local builds
      - branch, pull-request, merge-conflict, or repository administration
      - CI or diagnostics interpretation
      - release assembly or artifact selection
      - defect ownership or routing decisions
  owner:
    retains:
      - final product authority
      - final release approval
      - private credential and environment control
      - approval of destructive operations
    participation_limited_to:
      - focused questions that cannot be answered from existing evidence
      - approved builds on physical hardware or private environments
      - concise result, screenshot, log, or support-bundle reporting
      - final product, material architecture, and release approval

owner_question_contract:
  required_before_asking:
    - inspect repository and current behavior
    - inspect relevant issues, pull requests, project instructions, and current register
    - confirm the answer cannot be resolved safely elsewhere
    - avoid repeating an answered question
  request_fields:
    - exact_issue
    - reason_owner_answer_is_required
    - focused_question
    - concrete_options_when_known
    - implementation_or_release_impact
  issue_state:
    label: status:blocked
    evidence_heading: Owner question request

owner_test_session_contract:
  required_before_requesting:
    - exhaust available automated and repository-based validation
    - publish the exact approved candidate through the approved test distribution path
    - verify version, source commit, artifacts, checksums, signing identity, backup, and rollback
  request_fields:
    - exact_issue_and_feature
    - reason_physical_or_private_execution_is_required
    - version_branch_commit_and_pull_request
    - artifact_or_update_channel
    - checksum_and_signing_identity
    - backup_and_rollback_state
    - short_numbered_test_checklist
    - expected_results
    - stop_conditions
    - evidence_return_method
  issue_state:
    label: status:validation
    evidence_heading: Owner test session
  windows_distribution: owner-test_in_app_update_channel
  android_distribution: verified_apk_with_signature_and_checksum
  unchanged_binary_retest: prohibited_unless_environment_changed_and_reason_recorded

owners:
  architecture:
    chat: "1. Product Architecture"
    label: owner:architecture
    scope:
      - platform architecture
      - cross-module contracts
      - branch ownership
      - compatibility policy
      - security boundaries

  desktop-core:
    chat: "Khaos Nexus Desktop Application Core"
    label: owner:desktop-core
    scope:
      - Electron main and renderer shell
      - startup and recovery
      - navigation and shared desktop UI
      - local configuration and secure storage integration

  diagnostics:
    chat: "Khaos Nexus Diagnostics"
    label: owner:diagnostics
    scope:
      - diagnostics launcher and runtime
      - monitoring and support bundles
      - redaction and failure evidence

  release-ci:
    chat: "Khaos Nexus Release and CI"
    label: owner:release-ci
    scope:
      - GitHub Actions
      - Windows packaging
      - release publication
      - updater assets and checksums
      - approved Owner-test candidate publication

  discord-runtime:
    chat: "Khaos Nexus Bot Core"
    label: owner:discord-runtime
    scope:
      - supervised Discord bot runtime
      - commands and interactions
      - runtime configuration
      - Discord delivery contracts

  discord-studio:
    chat: "Khaos Nexus Discord Features"
    label: owner:discord-studio
    scope:
      - embeds and persistent panels
      - role menus and automation
      - logs and Discord-facing features

  discord-onboarding:
    chat: "Khaos Nexus Discord Onboarding"
    label: owner:discord-onboarding
    scope:
      - server onboarding
      - shared bot and bring-your-own-bot flows
      - initial Discord setup and permissions

  scheduler:
    chat: "Khaos Nexus Scheduler Design"
    label: owner:scheduler
    scope:
      - recurring schedules
      - warning, save, shutdown, restart, and verification workflows
      - interrupted-job recovery

  game-adapters:
    chat: "Khaos Nexus Game Adapters"
    label: owner:game-adapters
    scope:
      - typed Game Adapter SDK
      - ARK and generic RCON
      - Palworld REST and RCON
      - Rust WebRCON
      - Satisfactory dedicated-server API

  android:
    chat: "Khaos Nexus Android Companion"
    label: owner:android
    scope:
      - mobile gateway
      - pairing and device trust
      - Android application
      - verified Owner-test APK preparation

  dnd:
    chat: "Khaos Nexus Dungeons and Dragons"
    label: owner:dnd
    scope:
      - D&D campaign workspace
      - characters, sessions, encounters, and homebrew

  module-center:
    chat: "Khaos Nexus Module Center"
    label: owner:module-center
    scope:
      - module catalog and dependencies
      - module enablement and recovery
      - migration tracking

handoff_required_fields:
  - register_revision
  - decision_ids
  - primary_chat
  - secondary_chats_requiring_action
  - type
  - priority
  - requested_change
  - reason
  - confirmed_requirements
  - current_system_inspection
  - approved_repository_baseline
  - constraints
  - dependencies
  - expected_result
  - questions
  - owner_participation_expected
  - owner_question_gate
  - owner_test_session_plan

coordination_check:
  - register_revision
  - decision_ids
  - handoff_issue
  - primary_owner
  - baseline_branch_commit_and_pr
  - conflicts_or_blockers
  - existing_behavior_inspected
  - automated_validation_completed
  - owner_action_required
