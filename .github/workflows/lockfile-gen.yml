name: Generate Nexus npm Lockfile

on:
  push:
    branches:
      - 'ci/deterministic-npm-lock'
  pull_request:
    branches:
      - 'rebuild/nexus-0.1'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/deterministic-npm-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - shell: bash
        run: |
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) throw new Error('Expected lockfileVersion 3'); if(p.packages?.['']?.version!=='0.1.0') throw new Error('Unexpected root version');"
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already matches the generated Node 22 lockfile.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add deterministic npm lockfile'
          git push origin HEAD:ci/deterministic-npm-lock
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
