name: Stable Release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release branch and package version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedBranch = "release/v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedBranch) {
            throw "Release branch '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedBranch'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        run: npm install

      - name: Run complete tests
        run: npm test

      - name: Run syntax and package checks
        run: npm run check

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Verify updater assets and create checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $required = @(
            "dist/Khaos-Nexus-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Setup-$version-x64.exe.blockmap",
            "dist/Khaos-Nexus-Portable-$version-x64.exe",
            "dist/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required updater asset was not generated: $file" }
          }
          $required | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists. Increase package.json before publishing again." }

          @"
          ## Khaos Nexus $tag

          This is a validated stable Windows release for the Khaos Nexus in-app update channel.

          ### Included
          - Windows installer
          - Portable Windows executable
          - electron-updater metadata
          - NSIS blockmap
          - SHA-256 checksum manifest

          The release was rebuilt from commit `$env:GITHUB_SHA` and passed the complete tests and syntax checks before publication.
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          gh release create $tag --target $env:GITHUB_SHA --title "Khaos Nexus $tag" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub draft release creation failed." }

          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
          }
          gh release upload $tag release-checksums.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release-checksums.txt." }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable release $tag." }
