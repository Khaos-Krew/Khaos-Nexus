name: Stable Release

on:
  push:
    branches:
      - "release/v*"
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: true

jobs:
  publish-windows-release:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'publish/v')
      )
    runs-on: windows-latest
    steps:
      - name: Check out validated release source only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release source, approval branch, and package version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedReleaseBranch = "release/v$version"
          $releaseBranch = if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') { "${{ github.event.pull_request.base.ref }}" } else { $env:GITHUB_REF_NAME }
          $targetSha = if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') { "${{ github.event.pull_request.base.sha }}" } else { $env:GITHUB_SHA }

          if ($releaseBranch -ne $expectedReleaseBranch) {
            throw "Release branch '$releaseBranch' does not match package version '$version'. Expected '$expectedReleaseBranch'."
          }

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') {
            $expectedApprovalBranch = "publish/v$version"
            $approvalBranch = "${{ github.event.pull_request.head.ref }}"
            $headRepository = "${{ github.event.pull_request.head.repo.full_name }}"
            if ($headRepository -ne $env:GITHUB_REPOSITORY) {
              throw "Stable publication approval must originate from the same repository."
            }
            if ($approvalBranch -ne $expectedApprovalBranch) {
              throw "Approval branch '$approvalBranch' does not match '$expectedApprovalBranch'."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        run: npm install

      - name: Run complete tests
        run: npm test

      - name: Run syntax and package checks
        run: npm run check

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Verify updater assets, Android exclusion, and create checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $required = @(
            "dist/Khaos-Nexus-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Setup-$version-x64.exe.blockmap",
            "dist/Khaos-Nexus-Portable-$version-x64.exe",
            "dist/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required updater asset was not generated: $file" }
          }
          $androidAssets = Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($androidAssets) {
            throw "ADR-008 violation: Android or Mobile assets were generated for the stable Windows release."
          }
          $required | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $targetSha = "${{ steps.version.outputs.target_sha }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists. Increase package.json before publishing again." }

          $notesPath = "release-notes/v$version.md"
          if (-not (Test-Path $notesPath)) {
            throw "Stable release notes are missing: $notesPath"
          }

          gh release create $tag --target $targetSha --title "Khaos Nexus $tag" --notes-file $notesPath --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub draft release creation failed." }

          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
          }
          gh release upload $tag release-checksums.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release-checksums.txt." }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable release $tag." }
