name: Stable Release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release branch and package version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedBranch = "release/v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedBranch) {
            throw "Release branch '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedBranch'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download exact validated Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = 30035659968
          $expectedHeadSha = "d202d35689f0055961bfe1a21672536d37d71d3b"
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read validated workflow run $runId." }
          if ($run.name -ne "Windows Build") { throw "Workflow run $runId is '$($run.name)', not Windows Build." }
          if ($run.conclusion -ne "success") { throw "Workflow run $runId did not complete successfully." }
          if ($run.head_sha -ne $expectedHeadSha) {
            throw "Workflow run $runId built '$($run.head_sha)' instead of expected '$expectedHeadSha'."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name "Khaos-Nexus-Windows" --dir dist
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the validated Windows artifact from run $runId." }

      - name: Verify updater assets and create checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $required = @(
            "dist/Khaos-Nexus-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Setup-$version-x64.exe.blockmap",
            "dist/Khaos-Nexus-Portable-$version-x64.exe",
            "dist/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required updater asset was not found in the validated artifact: $file" }
          }
          $latestMetadata = Get-Content "dist/latest.yml" -Raw
          if ($latestMetadata -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "latest.yml does not identify version $version."
          }
          $required | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $sourceSha = "d202d35689f0055961bfe1a21672536d37d71d3b"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists. Increase package.json before publishing again." }

          @"
          ## Khaos Nexus $tag

          Discord Automation Center release for the Khaos Nexus stable Windows update channel.

          ### Included
          - button-driven role and color menus
          - safe role hierarchy validation
          - additive Discord category and channel layouts
          - structured local and optional Discord audit logs
          - Windows installer and portable executable
          - electron-updater metadata and NSIS blockmap
          - SHA-256 checksum manifest

          The published files are the exact artifact from successful Windows Build run 30035659968 for commit `$sourceSha`.
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          gh release create $tag --target $sourceSha --title "Khaos Nexus $tag" --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub draft release creation failed." }

          $assets = @(
            "dist/Khaos-Nexus-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Setup-$version-x64.exe.blockmap",
            "dist/Khaos-Nexus-Portable-$version-x64.exe",
            "dist/latest.yml",
            "release-checksums.txt"
          )
          foreach ($asset in $assets) {
            gh release upload $tag $asset
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset." }
          }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable release $tag." }
