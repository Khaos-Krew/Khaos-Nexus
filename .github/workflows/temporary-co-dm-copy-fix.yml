name: Apply Veyra Runtime Disclosure Copy Fix

on:
  push:
    branches:
      - feature/unified-ai-runtime

permissions:
  contents: write

jobs:
  apply-copy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-ai-runtime
          fetch-depth: 0

      - name: Update Veyra runtime disclosure
        shell: python
        run: |
          from pathlib import Path
          path = Path('renderer/dnd-co-dm.js')
          source = path.read_text(encoding='utf-8')
          old = 'AI providers and provider credentials are owned by the separate <strong>Khaos-Nexus-AI</strong> service. The desktop stores no OpenAI key and sends campaign context only after an explicit generation action.'
          new = '<strong>Veyra</strong> runs as the D&amp;D worker inside the <strong>Khaos Nexus AI Runtime</strong>. Provider credentials remain isolated from the desktop, which stores no OpenAI key and sends campaign context only after an explicit generation action.'
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one legacy Co-DM provider disclosure')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-co-dm-copy-fix.yml').unlink()

      - name: Commit copy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Identify Veyra within the unified AI runtime"
          git push origin HEAD:feature/unified-ai-runtime
