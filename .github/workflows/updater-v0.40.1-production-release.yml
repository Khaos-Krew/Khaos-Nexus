name: Approved v0.40.1 Production Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["release/v0.35.0-B"]

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.40.1-production
  cancel-in-progress: true

jobs:
  publish-windows-production:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.40.1-production-cleanup' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      APPROVED_APP_SHA: ef73cb615f17a478d69a25a1ebb5110e443f1fb3
      RELEASE_VERSION: 0.40.1
      RELEASE_TAG: v0.40.1
      ROLLBACK_TAG: v0.40.0
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved v0.40.1 application source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $expected = '.github/workflows/updater-v0.40.1-production-release.yml'
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "Publisher differs outside its workflow: $($changed -join ', ')"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-windows-

      - name: Validate exact application and embedded agents
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.40.1 production identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.40.1 — Performance, Navigation & Production Hardening

          v0.40.1 promotes the v0.40 recovery/resource foundation with a full renderer performance cleanup, corrected workspace navigation, and a hardened Windows release pipeline.

          Performance fixes remove the permanent high-frequency interface-watchdog capture loop after startup stabilizes, eliminate duplicate renderer state polling, stop recurring full D&D workspace remounts, stop the completed startup countdown timer, and limit AI control polling to the active AI workspace.

          Navigation now has one authoritative workspace model. Command, D&D, Nexus AI, Discord & Community, Game Servers, Operations & Access, Modules & Tools, and System are distinct directories. Unknown/new module views fall under Modules & Tools rather than Settings.

          Renderer lifecycle cleanup centralizes extension asset loading, global application-state fan-out, and shared D&D DOM change signaling. This reduces duplicate Electron load hooks, direct global state subscribers, and broad MutationObserver ownership while preserving feature behavior.

          The v0.40 deterministic Recovery Supervisor and adaptive resource governor remain included. AI remains manual-start only; an intentionally stopped AI runtime stays stopped. Veyra has no system-repair authority, and Sentinel remains constrained to the established supervised repair boundaries.

          The D&D Beyond fillable-PDF and JSON Character importer remains included, along with existing deterministic D&D authority and player-agency protections.

          Production packaging is now hardened with lockfile-based installs, dependency/Electron caching, packaged-content auditing, strict packaged startup readiness, real silent clean-install validation, previous-public-release upgrade validation with isolated user-data preservation, SHA-256 release manifests, and an Authenticode policy gate ready for Owner-managed code-signing credentials.
          '@ | Set-Content release-notes/v0.40.1.md -Encoding utf8

          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.40.1'
          $p.khaosRelease.displayVersion = '0.40.1'
          $p.khaosRelease.artifactVersion = '0.40.1'
          $p.khaosRelease.publicTag = 'v0.40.1'
          $p.khaosRelease.channel = 'production'
          $p.khaosRelease.updaterVersion = '0.40.1'
          $p.khaosRelease.rollbackTag = 'v0.40.0'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.40.1 — Performance, Navigation & Production Hardening'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.40.1.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.40.1-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.40.1-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows candidate once
        shell: pwsh
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-packaged-ai-runtimes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit packaged app contents
        run: node scripts/audit-packaged-contents.cjs

      - name: Verify packaged production wiring
        shell: pwsh
        run: |
          @'
          'use strict';
          const asar = require('@electron/asar');
          const archive = 'dist/win-unpacked/resources/app.asar';
          const pkg = JSON.parse(asar.extractFile(archive, 'package.json').toString('utf8'));
          const entry = asar.extractFile(archive, 'main/entry.cjs').toString('utf8');
          const bootstrap = asar.extractFile(archive, 'main/entry-pdf-import.cjs').toString('utf8');
          const loader = asar.extractFile(archive, 'main/renderer-asset-loader.cjs').toString('utf8');
          const stateHub = asar.extractFile(archive, 'renderer/state-hub.js').toString('utf8');
          const domHub = asar.extractFile(archive, 'renderer/dnd-dom-hub.js').toString('utf8');
          const shell = asar.extractFile(archive, 'renderer/nexus-shell-v14.js').toString('utf8');
          const recovery = asar.extractFile(archive, 'main/ai-recovery-supervisor-extension.cjs').toString('utf8');
          const governor = asar.extractFile(archive, 'shared/ai-recovery-governor.cjs').toString('utf8');
          const pdfExtension = asar.extractFile(archive, 'main/dnd-character-pdf-import-extension.cjs').toString('utf8');
          const pdfParser = asar.extractFile(archive, 'shared/dnd-character-pdf-import.cjs').toString('utf8');
          if (pkg.version !== '0.40.1' || pkg.khaosRelease?.publicTag !== 'v0.40.1') throw new Error('Packaged release identity is invalid.');
          if (pkg.khaosRelease?.rollbackTag !== 'v0.40.0') throw new Error('Packaged rollback target is invalid.');
          if (pkg.main !== 'main/entry-pdf-import.cjs') throw new Error('PDF import bootstrap is not the packaged desktop entrypoint.');
          if (!bootstrap.includes('dnd-character-pdf-import-extension.cjs') || !bootstrap.includes("require('./entry.cjs')")) throw new Error('Desktop bootstrap wiring is incomplete.');
          if (!entry.includes("require('./ai-recovery-supervisor-extension.cjs').install()")) throw new Error('Recovery Supervisor is not installed.');
          if (!loader.includes('registerRendererBundle')) throw new Error('Shared renderer asset loader is missing.');
          if (!stateHub.includes('khaosStateHub') || !stateHub.includes('subscribe')) throw new Error('Shared renderer state hub is missing.');
          if (!domHub.includes('khaosDndDomHub')) throw new Error('Shared D&D DOM hub is missing.');
          if (!shell.includes("return 'modules'")) throw new Error('Unknown workspace fallback is not Modules & Tools.');
          for (const marker of ['RecoveryStore', 'selectRuntimeBudget', 'authorizedAgents', 'runtime.restart-authorized']) if (!recovery.includes(marker)) throw new Error(`Recovery Supervisor missing ${marker}`);
          for (const marker of ['REPAIR_ACTIONS', 'selectProvider', 'selectModel', 'executeRepair', 'RECOVERY_OWNER_APPROVAL_REQUIRED']) if (!governor.includes(marker)) throw new Error(`Recovery governor missing ${marker}`);
          if (!pdfExtension.includes("extensions: ['pdf', 'json']") || !pdfExtension.includes('parsePdfCharacterImportBuffer')) throw new Error('PDF + JSON Character import support is missing.');
          if (!pdfParser.includes('dnd-character-pdf-form-v1')) throw new Error('Fillable-PDF parser is missing.');
          console.log('Packaged v0.40.1 production wiring verified.');
          '@ | Set-Content .github-verify-v0401.cjs -Encoding utf8
          node .github-verify-v0401.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test packaged full startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Smoke-test clean installed candidate
        shell: pwsh
        run: ./scripts/smoke-installed-build.ps1

      - name: Smoke-test v0.40.0 to v0.40.1 upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/smoke-installed-upgrade.ps1 -PreviousTag v0.40.0

      - name: Verify updater artifacts and write release manifest
        env:
          KHAOS_REQUIRE_UPDATER_METADATA: '1'
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
        run: node scripts/verify-release-artifacts.cjs

      - name: Verify Windows Authenticode policy
        shell: pwsh
        env:
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
        run: ./scripts/verify-windows-signatures.ps1

      - name: Write provenance and checksums
        shell: pwsh
        env:
          PUBLISHER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [pscustomobject]@{
            schemaVersion = 1
            product = 'Khaos Nexus'
            version = '0.40.1'
            approvedApplicationCommit = $env:APPROVED_APP_SHA
            publisherCommit = $env:PUBLISHER_SHA
            rollbackTag = $env:ROLLBACK_TAG
            validatedUpgrade = 'v0.40.0 -> v0.40.1'
            signingRequired = ($env:KHAOS_REQUIRE_SIGNING -eq '1')
          } | ConvertTo-Json -Depth 6 | Set-Content dist/release-provenance.json -Encoding utf8
          $files = @(
            'dist/Khaos-Nexus-Setup-0.40.1-x64.exe',
            'dist/Khaos-Nexus-Setup-0.40.1-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.40.1-x64.exe',
            'dist/latest.yml',
            'dist/release-manifest.json',
            'dist/package-content-audit.json',
            'dist/signing-audit.json',
            'dist/release-provenance.json'
          )
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Missing validated release file: $file" } }
          $files | ForEach-Object { "$( (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))" } | Set-Content dist/release-checksums.txt

      - name: Publish the validated artifact set and verify latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.40.1-x64.exe',
            'dist/Khaos-Nexus-Setup-0.40.1-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.40.1-x64.exe',
            'dist/latest.yml',
            'dist/release-manifest.json',
            'dist/package-content-audit.json',
            'dist/signing-audit.json',
            'dist/release-provenance.json',
            'dist/release-checksums.txt'
          )
          gh release create v0.40.1 --target $env:RELEASE_SHA --title 'Khaos Nexus v0.40.1 — Performance, Navigation & Production Hardening' --notes-file release-notes/v0.40.1.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.40.1 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'v0.40.1 tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.40.1') { throw 'v0.40.1 is not the latest updater-visible release.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @('Khaos-Nexus-Setup-0.40.1-x64.exe','Khaos-Nexus-Setup-0.40.1-x64.exe.blockmap','Khaos-Nexus-Portable-0.40.1-x64.exe','latest.yml','release-manifest.json','package-content-audit.json','signing-audit.json','release-provenance.json','release-checksums.txt')) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.40.1-Production
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Khaos-Nexus-Setup-0.40.1-x64.exe
            dist/Khaos-Nexus-Setup-0.40.1-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.40.1-x64.exe
            dist/latest.yml
            dist/release-manifest.json
            dist/package-content-audit.json
            dist/signing-audit.json
            dist/release-provenance.json
            dist/release-checksums.txt
            release-notes/v0.40.1.md
