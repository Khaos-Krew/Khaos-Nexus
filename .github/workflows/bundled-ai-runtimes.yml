name: Bundled AI Runtimes

on:
  pull_request:
    paths:
      - 'main/bundled-ai-runtimes-extension.cjs'
      - 'scripts/build-bundled-ai-runtimes.cjs'
      - 'scripts/freeze-v0.33-bundled-ai.cjs'
      - 'test/bundled-ai-runtimes.test.cjs'
      - 'release-notes/v0.33.0.md'
      - '.github/workflows/bundled-ai-runtimes.yml'
      - 'main/entry.cjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node-free-package:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DND_AI_COMMIT: 19c718917377d6148f9baaee8ac8dcb937692f32
      AI_CORE_COMMIT: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
    steps:
      - name: Check out Khaos Nexus desktop
        uses: actions/checkout@v4

      - name: Check out D&D AI snapshot
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: ${{ env.DND_AI_COMMIT }}
          path: .ai-sources/dnd-ai

      - name: Check out Nexus AI Core snapshot
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI-Core
          ref: ${{ env.AI_CORE_COMMIT }}
          path: .ai-sources/ai-core

      - name: Set up build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install D&D AI production dependencies
        working-directory: .ai-sources/dnd-ai
        run: npm ci --omit=dev

      - name: Install AI Core production dependencies
        working-directory: .ai-sources/ai-core
        run: npm ci --omit=dev

      - name: Build and verify bundled service resources
        run: node scripts/build-bundled-ai-runtimes.cjs

      - name: Freeze v0.33.0-B candidate metadata
        run: node scripts/freeze-v0.33-bundled-ai.cjs

      - name: Run repository tests
        run: npm test

      - name: Run repository checks
        run: npm run check

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Verify bundled resources and updater files
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'Khaos-Nexus-Setup-0.33.0-B-x64.exe' | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter 'Khaos-Nexus-Portable-0.33.0-B-x64.exe' | Select-Object -First 1
          $latest = Get-ChildItem dist -Filter 'latest.yml' | Select-Object -First 1
          $blockmap = Get-ChildItem dist -Filter '*.blockmap' | Select-Object -First 1
          if (-not $installer -or -not $portable -or -not $latest -or -not $blockmap) { throw 'Required updater artifacts are missing.' }
          $unpacked = Join-Path $PWD 'dist/win-unpacked/resources/ai-services'
          foreach ($service in @('dnd-ai','ai-core')) {
            $manifest = Join-Path $unpacked "$service/bundle-manifest.json"
            if (-not (Test-Path $manifest)) { throw "Missing packaged manifest: $manifest" }
          }
          if (Get-Command node -ErrorAction SilentlyContinue) { Write-Host 'Build runner has Node for CI; packaged runtime still uses the Electron executable.' }

      - name: Upload Node-free Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Windows-v0.33.0-B
          path: |
            dist/Khaos-Nexus-Setup-0.33.0-B-x64.exe
            dist/Khaos-Nexus-Portable-0.33.0-B-x64.exe
            dist/*.blockmap
            dist/latest.yml
            dist/builder-debug.yml
          if-no-files-found: error
