name: Bundled AI Runtimes

on:
  pull_request:
    paths:
      - 'packages/ai/**'
      - 'config/embedded-ai-sources.json'
      - 'main/bundled-ai-runtimes-extension.cjs'
      - 'main/nexus-core-**'
      - 'shared/nexus-core/**'
      - 'scripts/build-bundled-ai-runtimes.cjs'
      - 'scripts/sync-embedded-ai-sources.cjs'
      - 'scripts/verify-embedded-ai-sources.cjs'
      - 'scripts/materialize-assets.cjs'
      - 'scripts/verify-packaged-ai-runtimes.cjs'
      - 'scripts/freeze-v0.41-nexus-core.cjs'
      - 'scripts/smoke-packaged-startup.ps1'
      - 'test/bundled-ai-runtimes.test.cjs'
      - 'test/bundled-ai-packaging.test.cjs'
      - 'test/embedded-ai-sources.test.cjs'
      - 'test/nexus-core-**'
      - '.github/workflows/bundled-ai-runtimes.yml'
      - '.github/workflows/embed-ai-sources.yml'
      - 'main/entry.cjs'
      - 'package.json'
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundled-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-embedded-source-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out Khaos Nexus desktop with embedded AI source
        uses: actions/checkout@v4

      - name: Set up build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify embedded source integrity
        run: node scripts/verify-embedded-ai-sources.cjs

      - name: Validate embedded service source
        shell: pwsh
        run: |
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.41.0-B Nexus Core candidate metadata
        run: node scripts/freeze-v0.41-nexus-core.cjs

      - name: Run complete repository validation
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Verify all unpacked AI runtime files
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Require packaged startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Silently install and verify all installed AI runtime files
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/Khaos-Nexus-Setup-0.41.0-B-x64.exe'
          $installRoot = 'C:\khaos-nexus-core-v041-pr-ci'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)." }
          node scripts/verify-packaged-ai-runtimes.cjs (Join-Path $installRoot 'resources\ai-services')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify updater files
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/Khaos-Nexus-Setup-0.41.0-B-x64.exe'
          $portable = Get-Item 'dist/Khaos-Nexus-Portable-0.41.0-B-x64.exe'
          $latest = Get-Item 'dist/latest.yml'
          $blockmap = Get-Item 'dist/Khaos-Nexus-Setup-0.41.0-B-x64.exe.blockmap'
          foreach ($item in @($installer, $portable, $latest, $blockmap)) {
            if ($item.Length -le 0) { throw "Required updater artifact is empty: $($item.FullName)" }
          }
          $latestText = Get-Content $latest.FullName -Raw
          if ($latestText -notmatch '(?m)^version:\s*0\.41\.0\s*$') { throw 'latest.yml does not advertise v0.41.0.' }
          if ($latestText -notmatch 'Khaos-Nexus-Setup-0\.41\.0-B-x64\.exe') { throw 'latest.yml does not reference the v0.41.0-B installer.' }

      - name: Upload embedded-source Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Windows-embedded-ai
          path: |
            dist/Khaos-Nexus-Setup-0.41.0-B-x64.exe
            dist/Khaos-Nexus-Portable-0.41.0-B-x64.exe
            dist/*.blockmap
            dist/*.yml
            dist/builder-debug.yml
          if-no-files-found: error
