name: Temporary Unified AI Source Export

on:
  push:
    branches:
      - feature/unified-ai-runtime
  pull_request:
    branches:
      - release/v0.35.0-B

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          git archive --format=zip --output=khaos-nexus-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: unified-ai-working-source
          path: khaos-nexus-source.zip
          if-no-files-found: error
          retention-days: 1
