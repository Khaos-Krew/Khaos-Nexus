name: Apply D&D Campaign Runtime Foundation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - hotfix/v0.37.0-ai-cold-start

permissions:
  contents: write

jobs:
  apply-foundation:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/dnd-campaign-runtime-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out private feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/dnd-campaign-runtime-foundation
          fetch-depth: 0

      - name: Materialize runtime foundation
        shell: python
        run: |
          import base64
          import json
          import zlib
          from pathlib import Path

          payload_dir = Path('.dnd-runtime-payload')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in sorted(payload_dir.glob('part-*')))
          files = json.loads(zlib.decompress(base64.b64decode(encoded)).decode('utf-8'))
          for relative, content in files.items():
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          entry = Path('main/entry.cjs')
          source = entry.read_text(encoding='utf-8')
          anchor = "    require('./dnd-ai-gm-extension.cjs').install();\n"
          addition = anchor + "    require('./dnd-campaign-runtime-extension.cjs').install();\n"
          if "dnd-campaign-runtime-extension.cjs" not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('Expected one AI Game Master entry anchor.')
              entry.write_text(source.replace(anchor, addition, 1), encoding='utf-8')

      - name: Validate focused runtime foundation
        shell: bash
        run: |
          node --check shared/dnd-campaign-runtime.cjs
          node --check main/dnd-campaign-runtime-extension.cjs
          node --check renderer/dnd-campaign-runtime.js
          node --check main/entry.cjs
          node --test test/dnd-campaign-runtime.test.cjs test/dnd-campaign-runtime-wiring.test.cjs

      - name: Commit private development foundation
        shell: bash
        run: |
          rm -rf .dnd-runtime-payload .dnd-runtime-foundation-trigger .github/workflows/apply-dnd-runtime-foundation.yml
          git config user.name "Khaos Nexus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(dnd): add campaign runtime foundation"
          git push origin HEAD:feature/dnd-campaign-runtime-foundation
