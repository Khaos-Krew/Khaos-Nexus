name: Stabilization Release Identity

on:
  push:
    branches:
      - stabilize/nexus-66-baseline
    paths:
      - config/release-identity.json
      - scripts/apply-release-identity.cjs
      - package.json
      - release-notes/**
      - .github/workflows/stabilization-release-identity.yml

permissions:
  contents: write

jobs:
  normalize-release-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/nexus-66-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply authoritative release identity
        run: node scripts/apply-release-identity.cjs
      - name: Verify package identity
        run: |
          node -e "const p=require('./package.json'); const r=require('./config/release-identity.json'); if(p.version!==r.version||p.khaosRelease.displayVersion!==r.displayVersion||p.khaosRelease.publicTag!==r.publicTag||p.build.releaseInfo.releaseNotesFile!==r.releaseNotesFile) process.exit(1)"
      - name: Commit normalized package metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json; then
            echo 'package.json already matches authoritative release identity.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m 'stabilization: normalize package identity to v0.41.2-B'
          git push origin HEAD:stabilize/nexus-66-baseline
