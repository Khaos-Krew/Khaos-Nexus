name: Refresh v0.37.0 Publisher

on:
  push:
    branches:
      - repair/v0.37.0-publisher-refresh

permissions:
  contents: write

concurrency:
  group: refresh-v0.37.0-publisher
  cancel-in-progress: true

jobs:
  refresh-publisher:
    runs-on: ubuntu-latest
    env:
      APPROVED_APP_SHA: 9f9ee22f9edb50d8288a8f7aee4ee5853ac7dfa6
      OLD_PUBLISHER_SHA: 268230d211a44f418e7d2f1cc9563df6dbfc5c65
      OLD_APPROVED_SHA: ec7f26d56f7f24cc2b1b9e6d0d3f4ce355e54c98
      TARGET_BRANCH: publish/v0.37.0-manual-start
      WORKFLOW_PATH: .github/workflows/updater-v0.37.0-manual-ai-test-release.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild workflow-only publisher from repaired application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git checkout --detach "$APPROVED_APP_SHA"
          git show "$OLD_PUBLISHER_SHA:$WORKFLOW_PATH" > "$WORKFLOW_PATH"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ['WORKFLOW_PATH'])
          text = path.read_text(encoding='utf-8')
          old = f"APPROVED_APP_SHA: {os.environ['OLD_APPROVED_SHA']}"
          new = f"APPROVED_APP_SHA: {os.environ['APPROVED_APP_SHA']}"
          if old not in text:
              raise SystemExit('Old approved application SHA was not found in publisher workflow')
          text = text.replace(old, new, 1)
          text = text.replace('# publisher trigger 2026-08-06T20:44:00Z', '# publisher source refresh 2026-08-07T20:38:00-05:00')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git add "$WORKFLOW_PATH"
          changed="$(git diff --cached --name-only)"
          test "$changed" = "$WORKFLOW_PATH"
          git commit -m "Publish v0.37.0 from repaired manual-start source"
          git push --force origin HEAD:"$TARGET_BRANCH"
