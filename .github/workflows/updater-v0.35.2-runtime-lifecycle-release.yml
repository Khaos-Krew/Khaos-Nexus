name: Approved v0.35.2 AI Runtime Lifecycle Hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "release/v0.35.0-B"

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.35.2
  cancel-in-progress: true

jobs:
  publish-windows-hotfix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.35.2' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      APPROVED_APP_SHA: 620ddc7f6e6cee8c3f5cda0ef3d9444fd958611b
      DND_AI_COMMIT: 19c718917377d6148f9baaee8ac8dcb937692f32
      AI_CORE_COMMIT: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved hotfix source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/updater-v0.35.2-runtime-lifecycle-release.yml') {
            throw "Publisher may differ only by its workflow. Changed: $($changed -join ', ')"
          }

      - name: Check out bundled D&D AI
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: ${{ env.DND_AI_COMMIT }}
          path: .ai-sources/dnd-ai

      - name: Check out bundled Nexus AI Core
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI-Core
          ref: ${{ env.AI_CORE_COMMIT }}
          path: .ai-sources/ai-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bundled AI production dependencies
        shell: pwsh
        run: |
          Push-Location .ai-sources/dnd-ai; npm ci --omit=dev; Pop-Location
          Push-Location .ai-sources/ai-core; npm ci --omit=dev; Pop-Location

      - name: Build bundled AI resources
        run: node scripts/build-bundled-ai-runtimes.cjs

      - name: Run complete validation before release mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run check
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs

      - name: Freeze v0.35.2 hotfix identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.35.2 — AI Runtime Lifecycle Hotfix

          This hotfix repairs bundled AI service restart and shutdown races, closes inherited service-log handles, bounds AI Core readiness, isolates per-service failures, and prevents hidden or missing AI views from doing unbounded renderer work.

          Manual AI lifecycle controls are now Owner-protected, strictly validated, synchronized across Start/Restart/Stop/Start All, and recorded through bounded audit evidence.

          Android Companion and Mobile Gateway remain paused and excluded from the Windows package.
          '@ | Set-Content release-notes/v0.35.2.md -Encoding utf8
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.35.2'
          $p.khaosRelease.displayVersion = '0.35.2'
          $p.khaosRelease.artifactVersion = '0.35.2'
          $p.khaosRelease.publicTag = 'v0.35.2'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.35.2'
          $p.khaosRelease.rollbackTag = 'v0.35.1'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.35.2 — AI Runtime Lifecycle Hotfix'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.35.2.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.35.2-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.35.2-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows updater assets
        run: npm run dist:win

      - name: Require packaged startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Verify hotfix assets and package identity
        shell: pwsh
        run: |
          $files = @(
            'dist/Khaos-Nexus-Setup-0.35.2-x64.exe',
            'dist/Khaos-Nexus-Setup-0.35.2-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.35.2-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing required release asset: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty release asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.35\.2\s*$') { throw 'latest.yml does not advertise 0.35.2.' }
          if ($latest -notmatch 'Khaos-Nexus-Setup-0\.35\.2-x64\.exe') { throw 'latest.yml installer name mismatch.' }
          $asar = 'dist/win-unpacked/resources/app.asar'
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('$asar','package.json'));if(p.version!=='0.35.2')throw Error('bad version');"
          $android = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($android) { throw 'Mobile assets leaked into Windows package.' }
          $files | ForEach-Object { "$( (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))" } | Set-Content release-checksums.txt

      - name: Publish updater-visible v0.35.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = 'v0.35.2'
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.35.2-x64.exe',
            'dist/Khaos-Nexus-Setup-0.35.2-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.35.2-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          gh release create $tag --target $env:RELEASE_SHA --title 'Khaos Nexus v0.35.2 — AI Runtime Lifecycle Hotfix' --notes-file release-notes/v0.35.2.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Verify latest release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.35.2 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.35.2') { throw 'v0.35.2 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @('Khaos-Nexus-Setup-0.35.2-x64.exe','Khaos-Nexus-Setup-0.35.2-x64.exe.blockmap','Khaos-Nexus-Portable-0.35.2-x64.exe','latest.yml','release-checksums.txt')) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.35.2-Updater
          path: |
            dist/Khaos-Nexus-Setup-0.35.2-x64.exe
            dist/Khaos-Nexus-Setup-0.35.2-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.35.2-x64.exe
            dist/latest.yml
            release-checksums.txt
          if-no-files-found: error
