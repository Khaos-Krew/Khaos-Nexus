name: Nexus Sentinel Test Build

on:
  workflow_dispatch:
  push:
    branches: ["split/nexus-sentinel"]

permissions:
  contents: read

concurrency:
  group: nexus-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime install
        shell: pwsh
        run: |
          node -e "console.log(require('electron'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Sentinel source syntax
        shell: pwsh
        run: |
          node --check main/entry.cjs
          node --check main/sentinel-scope-extension.cjs
          node --check main/sentinel-owner-monitor-boundary-extension.cjs
          node --check main/renderer-asset-loader.cjs
          node --check main/startup-smoke-evidence-extension.cjs
          node --check renderer/sentinel-scope.js
          node --check renderer/sentinel-navigation-guard.js
          node --check renderer/sentinel-live-copy.js
          node --check renderer/sentinel-roadmap.js
          node --check bot/entry.cjs
          node --check bot/commands.cjs

      - name: Run Sentinel, Discord, Palworld and retained-control tests
        shell: pwsh
        run: |
          $tests = @(
            'test/sentinel-scope.test.cjs',
            'test/sentinel-roadmap-hardening.test.cjs',
            'test/palworld-rest.test.cjs',
            'test/server-client.test.cjs',
            'test/game-adapter-sdk.test.cjs',
            'test/player-console.test.cjs',
            'test/status-panels.test.cjs',
            'test/module-runtime-control.test.cjs',
            'test/application-monitor.test.cjs',
            'test/discord-auth.test.cjs',
            'test/discord-automation.test.cjs',
            'test/discord-automation-layout-edge.test.cjs',
            'test/discord-observability.test.cjs',
            'test/discord-observability-service.test.cjs',
            'test/discord-studio.test.cjs',
            'test/discord-studio-service.test.cjs',
            'test/redaction.test.cjs',
            'test/rcon-protocol.test.cjs',
            'test/rcon-guidance.test.cjs',
            'test/startup-health.test.cjs',
            'test/interface-watchdog.test.cjs',
            'test/window-visibility.test.cjs'
          )
          node --test --test-concurrency=1 $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Sentinel installer and portable executable
        run: npm run dist:win

      - name: Smoke-launch packaged Sentinel portable
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Portable-0.32.0-ROADMAP-x64.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Nexus Sentinel ROADMAP portable executable was not produced.' }

          $evidence = Join-Path $env:RUNNER_TEMP 'nexus-sentinel-startup-smoke.json'
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue
          $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
          $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
          $process = Start-Process -FilePath $portable.FullName -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(80)
            $state = $null
            $ui = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $evidence) {
                try {
                  $payload = Get-Content $evidence -Raw | ConvertFrom-Json
                  $state = $payload.state
                  $ui = $payload.ui
                } catch {}
                if ($state -and $state.completed -and $ui -and $ui.ready) { break }
              }
              if ($process.HasExited) { throw "Nexus Sentinel exited before packaged startup completed (exit $($process.ExitCode))." }
            }

            if (-not $state) { throw 'Nexus Sentinel did not write packaged startup evidence.' }
            if (-not $state.completed) { throw "Nexus Sentinel startup did not complete. Phase: $($state.phase); overall: $($state.overall)" }
            if (-not $state.rendererBridgeReady) { throw 'Nexus Sentinel renderer IPC bridge did not become ready.' }
            if (-not $state.rendererModulesReady) { throw 'Nexus Sentinel renderer feature modules did not become ready.' }
            if (-not $state.configStoreReady) { throw 'Nexus Sentinel configuration service did not become ready.' }
            $criticalFailures = @($state.checks | Where-Object { $_.critical -and $_.status -eq 'fail' })
            if ($criticalFailures.Count -gt 0) {
              $detail = ($criticalFailures | ForEach-Object { "$($_.id): $($_.detail)" }) -join '; '
              throw "Nexus Sentinel packaged startup has critical failures: $detail"
            }
            if ($state.overall -notin @('healthy', 'warning')) { throw "Unexpected Nexus Sentinel startup health: $($state.overall)" }

            if (-not $ui) { throw 'Nexus Sentinel did not write final renderer scope evidence.' }
            if (-not $ui.ready) {
              $forbidden = @($ui.forbiddenVisible) -join ', '
              throw "Nexus Sentinel final renderer scope is wrong. product=$($ui.product), guard=$($ui.guard), scopeReady=$($ui.scopeReady), brand='$($ui.brandSubtitle)', forbidden='$forbidden', serverOptions='$(@($ui.serverOptions) -join ',')', serverIntro='$($ui.serverIntro)', emptyServerHeading='$($ui.emptyServerHeading)', serverCopyScoped=$($ui.serverCopyScoped), dashboardRoadmap=$($ui.dashboardRoadmap), moduleCenter=$($ui.moduleCenter), moduleCardCount=$($ui.moduleCardCount), legacyModuleCenterHidden=$($ui.legacyModuleCenterHidden), legacyBaseModuleVisible=$($ui.legacyBaseModuleVisible), roadmapLabels='$(@($ui.roadmapLabels) -join ',')'"
            }
            if ($ui.product -ne 'sentinel') { throw "Nexus Sentinel renderer product marker is '$($ui.product)'." }
            if ($ui.brandSubtitle -ne 'Discord + Palworld Control Center') { throw "Nexus Sentinel renderer brand is '$($ui.brandSubtitle)'." }
            if (@($ui.forbiddenVisible).Count -gt 0) { throw "Forbidden monolith views remain visible: $(@($ui.forbiddenVisible) -join ', ')." }
            if (@($ui.serverOptions).Count -gt 1 -or (@($ui.serverOptions).Count -eq 1 -and $ui.serverOptions[0] -ne 'palworld')) {
              throw "Nexus Sentinel server selector still exposes non-Palworld options: $(@($ui.serverOptions) -join ', ')."
            }
            if (-not $ui.serverCopyScoped) { throw "Nexus Sentinel server workspace still contains pre-split game copy: '$($ui.serverIntro)' / '$($ui.emptyServerHeading)'." }
            if (-not $ui.dashboardRoadmap) { throw 'Nexus Sentinel acceptance roadmap did not render on Command Center.' }
            if (-not $ui.moduleCenter) { throw 'Nexus Sentinel operational Module Center did not render.' }
            if ([int]$ui.moduleCardCount -lt 1) { throw 'Nexus Sentinel operational Module Center rendered without scoped module cards.' }
            if (-not $ui.legacyModuleCenterHidden) { throw 'Legacy migration Module Center remains visible.' }
            if ($ui.legacyBaseModuleVisible) { throw 'Inherited pre-split module grid or migration UI remains visible.' }
            if (-not $ui.validRoadmapLabels) { throw "Module Center emitted an unsupported status: $(@($ui.roadmapLabels) -join ', ')." }

            Write-Host "Packaged Nexus Sentinel startup passed: $($state.overall) / $($state.phase)"
            Write-Host "Final Sentinel UI passed: $($ui.brandSubtitle); forbidden views visible: $(@($ui.forbiddenVisible).Count)"
            Write-Host "Palworld copy passed: $($ui.serverIntro)"
            Write-Host "Operational roadmap passed: dashboard=$($ui.dashboardRoadmap); modules=$($ui.moduleCenter); cards=$($ui.moduleCardCount); statuses=$(@($ui.roadmapLabels) -join ', ')"
          } catch {
            Write-Host '--- Nexus Sentinel packaged startup evidence ---'
            if (Test-Path $evidence) { Get-Content $evidence -Raw | Write-Host }
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F 2>$null | Out-Null
            }
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE -ErrorAction SilentlyContinue
          }

      - name: Verify Sentinel artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Setup-0.32.0-ROADMAP-x64.exe'
          $portable = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Portable-0.32.0-ROADMAP-x64.exe'
          if (-not $setup) { throw 'Nexus Sentinel ROADMAP installer was not produced.' }
          if (-not $portable) { throw 'Nexus Sentinel ROADMAP portable executable was not produced.' }
          Write-Host "Installer: $($setup.Name)"
          Write-Host "Portable: $($portable.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Sentinel-Roadmap-Windows-Test
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          retention-days: 14
          if-no-files-found: error
