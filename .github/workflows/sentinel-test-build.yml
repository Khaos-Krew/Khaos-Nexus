name: Nexus Sentinel Test Build

on:
  workflow_dispatch:
  push:
    branches: ["split/nexus-sentinel"]

permissions:
  contents: read

concurrency:
  group: nexus-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime install
        shell: pwsh
        run: |
          node -e "console.log(require('electron'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Sentinel source syntax
        shell: pwsh
        run: |
          node --check main/entry.cjs
          node --check main/sentinel-scope-extension.cjs
          node --check main/renderer-asset-loader.cjs
          node --check renderer/sentinel-scope.js
          node --check bot/entry.cjs
          node --check bot/commands.cjs

      - name: Run Sentinel, Discord, Palworld and retained-control tests
        shell: pwsh
        run: |
          $tests = @(
            'test/sentinel-scope.test.cjs',
            'test/palworld-rest.test.cjs',
            'test/server-client.test.cjs',
            'test/game-adapter-sdk.test.cjs',
            'test/player-console.test.cjs',
            'test/status-panels.test.cjs',
            'test/module-runtime-control.test.cjs',
            'test/application-monitor.test.cjs',
            'test/discord-auth.test.cjs',
            'test/discord-automation.test.cjs',
            'test/discord-automation-layout-edge.test.cjs',
            'test/discord-observability.test.cjs',
            'test/discord-observability-service.test.cjs',
            'test/discord-studio.test.cjs',
            'test/discord-studio-service.test.cjs',
            'test/redaction.test.cjs',
            'test/rcon-protocol.test.cjs',
            'test/rcon-guidance.test.cjs',
            'test/startup-health.test.cjs',
            'test/interface-watchdog.test.cjs',
            'test/window-visibility.test.cjs'
          )
          node --test --test-concurrency=1 $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Sentinel installer and portable executable
        run: npm run dist:win

      - name: Smoke-launch packaged Sentinel portable
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Portable-*.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Nexus Sentinel portable executable was not produced.' }

          $evidence = Join-Path $env:RUNNER_TEMP 'nexus-sentinel-startup-smoke.json'
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue
          $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
          $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
          $process = Start-Process -FilePath $portable.FullName -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(80)
            $state = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $evidence) {
                try {
                  $payload = Get-Content $evidence -Raw | ConvertFrom-Json
                  $state = $payload.state
                } catch {}
                if ($state -and $state.completed) { break }
              }
              if ($process.HasExited) { throw "Nexus Sentinel exited before packaged startup completed (exit $($process.ExitCode))." }
            }

            if (-not $state) { throw 'Nexus Sentinel did not write packaged startup evidence.' }
            if (-not $state.completed) { throw "Nexus Sentinel startup did not complete. Phase: $($state.phase); overall: $($state.overall)" }
            if (-not $state.rendererBridgeReady) { throw 'Nexus Sentinel renderer IPC bridge did not become ready.' }
            if (-not $state.rendererModulesReady) { throw 'Nexus Sentinel renderer feature modules did not become ready.' }
            if (-not $state.configStoreReady) { throw 'Nexus Sentinel configuration service did not become ready.' }
            $criticalFailures = @($state.checks | Where-Object { $_.critical -and $_.status -eq 'fail' })
            if ($criticalFailures.Count -gt 0) {
              $detail = ($criticalFailures | ForEach-Object { "$($_.id): $($_.detail)" }) -join '; '
              throw "Nexus Sentinel packaged startup has critical failures: $detail"
            }
            if ($state.overall -notin @('healthy', 'warning')) { throw "Unexpected Nexus Sentinel startup health: $($state.overall)" }
            Write-Host "Packaged Nexus Sentinel startup passed: $($state.overall) / $($state.phase)"
          } catch {
            Write-Host '--- Nexus Sentinel packaged startup evidence ---'
            if (Test-Path $evidence) { Get-Content $evidence -Raw | Write-Host }
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F 2>$null | Out-Null
            }
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE -ErrorAction SilentlyContinue
          }

      - name: Verify Sentinel artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Setup-*.exe'
          $portable = Get-ChildItem dist -Filter 'Khaos-Nexus-Sentinel-Portable-*.exe'
          if (-not $setup) { throw 'Nexus Sentinel installer was not produced.' }
          if (-not $portable) { throw 'Nexus Sentinel portable executable was not produced.' }
          Write-Host "Installer: $($setup.Name)"
          Write-Host "Portable: $($portable.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Sentinel-Windows-Test
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          retention-days: 14
          if-no-files-found: error