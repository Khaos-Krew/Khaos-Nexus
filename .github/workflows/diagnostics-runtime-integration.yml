name: Diagnostics Runtime Integration

on:
  pull_request:
    paths:
      - main/diagnostic-runtime-updater.cjs
      - main/ai-services-*.cjs
      - bot/ai-core-client.cjs
      - bot/dual-ai-index.cjs
      - renderer/ai-services.*
      - shared/ai-service-connections.cjs
      - scripts/verify-diagnostics-runtime-release.cjs
      - .github/workflows/diagnostics-runtime-integration.yml
      - package.json
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'

permissions:
  contents: read

jobs:
  verify-published-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify latest diagnostics release
        run: node scripts/verify-diagnostics-runtime-release.cjs
