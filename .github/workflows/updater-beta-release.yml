name: Updater Beta Release

on:
  push:
    branches:
      - "updater/v0.26.5-beta"

permissions:
  contents: write

concurrency:
  group: updater-beta-v0.26.5
  cancel-in-progress: true

jobs:
  publish-windows-updater-beta:
    runs-on: windows-latest
    steps:
      - name: Check out exact updater candidate
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release identity
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ([string]$package.version -ne '0.26.5-beta.1') {
            throw "Source package version must remain 0.26.5-beta.1 for validated prerelease semantics."
          }
          if ([string]$package.build.extraMetadata.version -ne '0.26.5-beta') {
            throw "Packaged application version must display 0.26.5-beta."
          }
          if ([string]$package.build.releaseInfo.releaseName -ne 'Khaos Nexus v0.26.5-beta — D&D Feature Test') {
            throw "Release name does not match v0.26.5-beta."
          }
          if ($env:GITHUB_REF_NAME -ne 'updater/v0.26.5-beta') {
            throw "Unexpected updater publication branch: $env:GITHUB_REF_NAME"
          }

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete test suite
        run: npm test

      - name: Run syntax and package checks
        run: npm run check

      - name: Build Windows installer and portable executable
        run: npm run dist:win

      - name: Prepare stable-channel updater metadata for beta alias
        shell: pwsh
        run: |
          $metadataPath = 'dist/latest.yml'
          if (-not (Test-Path -LiteralPath $metadataPath)) {
            throw "Updater metadata is missing: $metadataPath"
          }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw
          $metadata = [regex]::Replace($metadata, '(?m)^version:\s*.+$', 'version: 0.26.5', 1)
          Set-Content -LiteralPath $metadataPath -Value $metadata -Encoding utf8
          $written = Get-Content -LiteralPath $metadataPath -Raw
          if ($written -notmatch '(?m)^version:\s*0\.26\.5\s*$') {
            throw "The updater feed was not rewritten to stable-channel version 0.26.5."
          }
          if ($written -notmatch 'Khaos-Nexus-Setup-0\.26\.5-beta-x64\.exe') {
            throw "The updater feed does not reference the visible v0.26.5-beta installer."
          }

      - name: Verify packaged version, assets, Android exclusion, and checksums
        shell: pwsh
        run: |
          $required = @(
            'dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe',
            'dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.26.5-beta-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required updater asset was not generated: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Generated updater asset is empty: $file" }
          }

          $androidAssets = Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($androidAssets) {
            throw "ADR-008 violation: Android or Mobile assets were generated for the Windows updater release."
          }

          node -e "const asar=require('@electron/asar'); const pkg=JSON.parse(asar.extractFile('dist/win-unpacked/resources/app.asar','package.json').toString('utf8')); if(pkg.version!=='0.26.5-beta') throw new Error('Packaged app version is '+pkg.version); console.log('Packaged app version verified:',pkg.version);"
          if ($LASTEXITCODE -ne 0) { throw "Packaged application version verification failed." }

          $required | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Publish v0.26.5-beta for Update Center
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.26.5-beta'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Refusing to replace published updater assets."
          }

          $notesPath = 'release-notes/v0.26.5-beta.1.md'
          gh release create $tag --target $env:GITHUB_SHA --title 'Khaos Nexus v0.26.5-beta' --notes-file $notesPath --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub draft release creation failed." }

          $assets = @(
            'dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe',
            'dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.26.5-beta-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          foreach ($asset in $assets) {
            gh release upload $tag $asset
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset." }
          }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish updater-visible release $tag." }

      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.26.5-beta-Windows
          path: |
            dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe
            dist/Khaos-Nexus-Setup-0.26.5-beta-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.26.5-beta-x64.exe
            dist/latest.yml
            release-checksums.txt
          if-no-files-found: error
