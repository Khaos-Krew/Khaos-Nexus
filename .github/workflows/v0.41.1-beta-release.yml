name: v0.41.1-B Beta Release

on:
  push:
    branches:
      - "release/v0.41.1-B"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0.41.1-B-beta-release
  cancel-in-progress: true

jobs:
  publish-windows-beta:
    runs-on: windows-latest
    steps:
      - name: Check out guarded beta publisher source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate approved application lineage
        shell: pwsh
        env:
          APPROVED_APP_SHA: 696383d0d0bcff719d6224b11d938183bc52e851
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Validated v0.41.1-B application source is not an ancestor of this publisher.' }
          $allowed = @(
            '.github/workflows/stable-release.yml',
            '.github/workflows/v0.41.1-beta-release.yml'
          )
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            throw "Application source changed after validation: $($unexpected -join ', ')"
          }
          Write-Host "Publisher is based on validated application SHA $env:APPROVED_APP_SHA."

      - name: Install exact dependencies
        run: npm ci

      - name: Freeze v0.41.1-B release metadata
        run: node scripts/freeze-v0.41.1-hotfix.cjs

      - name: Validate beta release identity
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne 'release/v0.41.1-B') { throw "Unexpected release branch: $env:GITHUB_REF_NAME" }
          if ([string]$package.version -ne '0.41.1') { throw 'Internal updater version must be 0.41.1.' }
          if ([string]$package.khaosRelease.displayVersion -ne '0.41.1-B') { throw 'Display version mismatch.' }
          if ([string]$package.khaosRelease.artifactVersion -ne '0.41.1-B') { throw 'Artifact version mismatch.' }
          if ([string]$package.khaosRelease.publicTag -ne 'v0.41.1-B') { throw 'Public tag mismatch.' }
          if ([string]$package.khaosRelease.channel -ne 'beta') { throw 'Release channel must be beta.' }
          if ([string]$package.khaosRelease.updaterVersion -ne '0.41.1') { throw 'Updater version mismatch.' }
          if ([string]$package.khaosRelease.rollbackTag -ne 'v0.41.0-B') { throw 'Rollback tag mismatch.' }
          if (-not (Test-Path -LiteralPath 'release-notes/v0.41.1.md')) { throw 'v0.41.1 release notes are missing.' }

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete tests
        run: npm test

      - name: Run syntax and package checks
        run: npm run check

      - name: Build Windows installer and portable executable
        run: npm run dist:win

      - name: Audit packaged app contents
        run: node scripts/audit-packaged-contents.cjs

      - name: Verify packaged AI runtimes
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Smoke-test packaged startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Smoke-test clean installer
        shell: pwsh
        run: ./scripts/smoke-installed-build.ps1

      - name: Verify release artifacts and manifest
        env:
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
          KHAOS_REQUIRE_UPDATER_METADATA: '1'
        run: node scripts/verify-release-artifacts.cjs

      - name: Verify Windows Authenticode policy
        shell: pwsh
        env:
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
        run: ./scripts/verify-windows-signatures.ps1

      - name: Verify beta updater metadata and create checksums
        shell: pwsh
        run: |
          $required = @(
            'dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe',
            'dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.41.1-B-x64.exe',
            'dist/beta.yml',
            'dist/release-manifest.json'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required beta release asset was not generated: $file" }
          }
          $beta = Get-Content -LiteralPath 'dist/beta.yml' -Raw
          if ($beta -notmatch '(?m)^version:\s*0\.41\.1\s*$') { throw 'beta.yml does not advertise updater version 0.41.1.' }
          if ($beta -notmatch 'Khaos-Nexus-Setup-0\.41\.1-B-x64\.exe') { throw 'beta.yml does not reference the v0.41.1-B installer.' }
          $required | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Publish v0.41.1-B GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.41.1-B'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it automatically." }
          gh release create $tag --target $env:GITHUB_SHA --title 'Khaos Nexus v0.41.1-B — Nexus Core Acceptance Hotfix' --notes-file 'release-notes/v0.41.1.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe',
            'dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.41.1-B-x64.exe',
            'dist/beta.yml',
            'dist/release-manifest.json',
            'dist/package-content-audit.json',
            'dist/signing-audit.json',
            'release-checksums.txt'
          )
          foreach ($asset in $assets) {
            if (Test-Path -LiteralPath $asset) {
              gh release upload $tag $asset
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset." }
            }
          }

      - name: Verify published beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view 'v0.41.1-B' --json tagName,isDraft,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v0.41.1-B') { throw 'Published release tag mismatch.' }
          if ($release.isDraft) { throw 'v0.41.1-B is still a draft.' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('Khaos-Nexus-Setup-0.41.1-B-x64.exe','Khaos-Nexus-Setup-0.41.1-B-x64.exe.blockmap','Khaos-Nexus-Portable-0.41.1-B-x64.exe','beta.yml','release-manifest.json','release-checksums.txt')) {
            if ($names -notcontains $name) { throw "Published release is missing $name." }
          }

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.41.1-B-Publication
          path: |
            dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe
            dist/Khaos-Nexus-Setup-0.41.1-B-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.41.1-B-x64.exe
            dist/beta.yml
            dist/release-manifest.json
            dist/package-content-audit.json
            dist/signing-audit.json
            release-checksums.txt
          if-no-files-found: error
          retention-days: 14
