name: README Feature Monitor (Paused During Stabilization)

# The previous workflow regenerated README feature blocks from docs/features.json
# and described `available` entries as production-ready. That model predates the
# v0.41 stabilization reset and can no longer represent the distinction between
# code that exists, code currently being revalidated, and an actually published
# release. Keep this workflow manual-only until the feature registry and README
# automation are deliberately redesigned for the post-stabilization model.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stabilization-status:
    runs-on: ubuntu-latest
    steps:
      - name: Explain documentation authority
        shell: bash
        run: |
          echo 'Automatic README feature regeneration is paused during the v0.41 stabilization reset.'
          echo 'Use the public README for project status and PR #266 / stabilize/nexus-66-baseline for active desktop stabilization evidence.'
          echo 'Do not treat legacy docs/features.json availability labels as proof of current release acceptance.'
