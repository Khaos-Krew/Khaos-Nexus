name: Android Production Hold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-production-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Report ADR-008 hold
        run: |
          echo "Android Companion and Mobile Gateway are paused and excluded by Owner directive under ADR-008."
          echo "No Android toolchain setup, build, signing, checksum, artifact upload, or Owner-test APK publication is authorized."
