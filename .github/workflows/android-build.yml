name: Android Owner Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'owner-test/**'
    paths:
      - 'package.json'
      - 'config/release-identity.json'
      - 'android/**'
      - 'main/mobile-*.cjs'
      - 'main/entry.cjs'
      - 'main/owner-test-center-extension.cjs'
      - 'renderer/mobile-*.js'
      - 'renderer/mobile-*.css'
      - 'renderer/owner-test-center.js'
      - 'renderer/owner-test-center.css'
      - 'renderer/ui-refresh.js'
      - 'renderer/ui-refresh.css'
      - 'test/mobile-*.test.cjs'
      - 'test/owner-test-center.test.cjs'
      - 'shared/module-registry.cjs'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - stabilize/nexus-66-baseline
    paths:
      - 'package.json'
      - 'config/release-identity.json'
      - 'android/**'
      - 'main/mobile-*.cjs'
      - 'main/entry.cjs'
      - 'main/owner-test-center-extension.cjs'
      - 'renderer/mobile-*.js'
      - 'renderer/mobile-*.css'
      - 'renderer/owner-test-center.js'
      - 'renderer/owner-test-center.css'
      - 'renderer/ui-refresh.js'
      - 'renderer/ui-refresh.css'
      - 'test/mobile-*.test.cjs'
      - 'test/owner-test-center.test.cjs'
      - 'shared/module-registry.cjs'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-owner-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Nexus build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          display="$(python3 -c "import json; print(json.load(open('package.json'))['khaosRelease']['displayVersion'])")"
          test -n "$display"
          echo "display=$display" >> "$GITHUB_OUTPUT"
          echo "Khaos Nexus display version: $display"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests and lint
        run: gradle --project-dir android testDebugUnitTest lintDebug --stacktrace --no-daemon
      - name: Build signed Owner-test APK
        run: gradle --project-dir android assembleRelease --stacktrace --no-daemon
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          display='${{ steps.identity.outputs.display }}'
          mkdir -p android/dist
          apk='android/app/build/outputs/apk/release/app-release.apk'
          out="android/dist/Khaos-Nexus-Mobile-${display}-owner-test.apk"
          checksum="android/dist/Khaos-Nexus-Mobile-${display}-owner-test.sha256"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee android/dist/apk-signature.txt
          cp "$apk" "$out"
          sha256sum "$out" | tee "$checksum"
      - uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Mobile-Android-${{ steps.identity.outputs.display }}-owner-test
          path: android/dist/*
          if-no-files-found: error
          retention-days: 90
