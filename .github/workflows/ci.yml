name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # PRs targeting the split Sentinel product use sentinel-test-build.yml as the
    # authoritative gate. The generic suite intentionally includes D&D/AI and
    # monolith-only assertions that are outside the Sentinel package boundary.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'split/nexus-sentinel' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload failed test output
        if: failure() && steps.tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: test-output.txt
          retention-days: 7
      - run: npm run check
