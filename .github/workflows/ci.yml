name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  repair-ai-manual-start:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hotfix/v0.37.0-ai-cold-start' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.37.0-ai-cold-start
          fetch-depth: 0

      - name: Enforce manual-only AI Runtime startup
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('main/bundled-ai-runtimes-extension.cjs')
          source = runtime.read_text(encoding='utf-8')
          old = """  electron.app.whenReady().then(() => {
            registerIpc();
            startAll();
          });"""
          new = """  electron.app.whenReady().then(() => {
            registerIpc();
          });"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one automatic AI Runtime startup block, found {source.count(old)}.')
          runtime.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('test/ai-runtime-manual-start.test.cjs')
          test.write_text(r'''\'use strict\';

const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.join(__dirname, '..');
const read = (file) => fs.readFileSync(path.join(root, file), 'utf8').replace(/\r\n/g, '\n');

test('AI Runtime remains stopped during desktop startup', () => {
  const source = read('main/bundled-ai-runtimes-extension.cjs');
  const install = source.match(/function install\(\) \{[\s\S]*?\n\}/)?.[0] || '';
  assert.match(install, /electron\.app\.whenReady\(\)\.then\(\(\) => \{\s*registerIpc\(\);\s*\}\);/);
  assert.doesNotMatch(install, /startAll\(\)/);
  assert.doesNotMatch(install, /startHost\(/);
});

test('AI Runtime can only be started through the registered in-app lifecycle action', () => {
  const runtime = read('main/bundled-ai-runtimes-extension.cjs');
  const controls = read('renderer/ai-runtime-controls-hotfix.js');
  assert.match(runtime, /ipcMain\.handle\('ai:runtimes-start'/);
  assert.match(runtime, /manualAction\('start', input\)/);
  assert.match(controls, /Start Khaos Nexus AI Runtime/);
  assert.match(controls, /data-ai-action="start" data-ai-service="all"/);
});
''', encoding='utf-8')

          doc = Path('docs/AI_RUNTIME_MANUAL_START.md')
          doc.write_text('''# AI Runtime Manual Start Policy

The Khaos Nexus AI Runtime must remain stopped when the Windows desktop application starts.

- Desktop startup registers lifecycle IPC and renders the stopped runtime state only.
- The host, Veyra, and Nexus Sentinel are not spawned during application startup.
- The Owner starts the runtime explicitly from the in-app **Start Khaos Nexus AI Runtime** control.
- Agent bundle verification and service readiness begin only after that explicit action.
- Closing Khaos Nexus still stops any runtime that the Owner started manually.

This policy prevents AI initialization from delaying or blocking normal desktop startup and preserves direct Owner control over local AI resource usage.
''', encoding='utf-8')

          for item in [
              '.github/workflows/temporary-ai-cold-start-patcher.yml',
              '.github/workflows/temporary-ai-cold-start-push.yml',
              '.github/workflows/temporary-ai-cold-start-ready.yml',
              'ai-cold-start-patch-error.txt',
              '.validation/ai-cold-start/doc.b64',
              '.validation/ai-cold-start/launcher.b64',
              '.validation/ai-cold-start/test.b64',
          ]:
              Path(item).unlink(missing_ok=True)
          for directory in [Path('.validation/ai-cold-start'), Path('.validation')]:
              try:
                  directory.rmdir()
              except OSError:
                  pass

      - name: Validate and commit manual-start policy
        shell: bash
        run: |
          set -euo pipefail
          node --check main/bundled-ai-runtimes-extension.cjs
          node --test test/ai-runtime-manual-start.test.cjs test/ai-runtime-controls-hotfix.test.cjs test/bundled-ai-runtimes.test.cjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep AI Runtime stopped until manual in-app start"
          git push origin HEAD:hotfix/v0.37.0-ai-cold-start

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload failed test output
        if: failure() && steps.tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: test-output.txt
          retention-days: 7
      - run: npm run check
