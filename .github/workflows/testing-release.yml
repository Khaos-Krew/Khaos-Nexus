name: D&D Testing Release

on:
  push:
    branches:
      - "release-test/v*"

permissions:
  contents: write

concurrency:
  group: dnd-testing-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-windows-prerelease:
    runs-on: windows-latest
    steps:
      - name: Check out exact testing source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate testing branch and package identity
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedBranch = "release-test/v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedBranch) {
            throw "Testing branch '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedBranch'."
          }
          if ($version -notmatch '-(alpha|beta|rc)\.') {
            throw "Testing publication requires a prerelease version, received '$version'."
          }
          if ([string]$package.build.publish[0].releaseType -ne 'prerelease') {
            throw "Testing publication requires electron-builder releaseType 'prerelease'."
          }
          $notesPath = "release-notes/v$version.md"
          if (-not (Test-Path $notesPath)) {
            throw "Testing release notes are missing: $notesPath"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete non-Android tests
        run: npm test

      - name: Run syntax and package checks
        run: npm run check

      - name: Verify published diagnostics runtime
        run: node scripts/verify-diagnostics-runtime-release.cjs

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Verify updater assets, Android exclusion, and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $required = @(
            "dist/Khaos-Nexus-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Setup-$version-x64.exe.blockmap",
            "dist/Khaos-Nexus-Portable-$version-x64.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required Windows testing asset was not generated: $file" }
          }
          $updateMetadata = Get-ChildItem dist -File -Filter '*.yml'
          if (-not $updateMetadata) { throw "No updater metadata file was generated." }
          $androidAssets = Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($androidAssets) {
            throw "ADR-008 violation: Android or Mobile assets were generated for the Windows testing release."
          }
          $checksumTargets = @($required) + @($updateMetadata.FullName)
          $checksumTargets | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path release-checksums.txt -Encoding utf8

      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Windows-v${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            release-checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $notesPath = "${{ steps.version.outputs.notes }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Testing release $tag already exists. Increase the prerelease version before publishing again." }

          gh release create $tag --target $env:GITHUB_SHA --title "Khaos Nexus $tag — D&D Feature Test" --notes-file $notesPath --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub testing draft release creation failed." }

          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
          }
          gh release upload $tag release-checksums.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release-checksums.txt." }

          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish testing release $tag." }
