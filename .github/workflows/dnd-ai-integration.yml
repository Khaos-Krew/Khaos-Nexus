name: D&D AI Integration

on:
  pull_request:
    paths:
      - 'main/dnd-co-dm-*.cjs'
      - 'main/dnd-ai-*.cjs'
      - 'renderer/dnd-co-dm.*'
      - 'renderer/dnd-ai-*.*'
      - 'shared/dnd-co-dm.cjs'
      - 'shared/dnd-ai-*.cjs'
      - 'scripts/verify-dnd-ai-integration.cjs'
      - 'scripts/verify-dnd-ai-maps-integration.cjs'
      - 'scripts/verify-dnd-ai-gm-integration.cjs'
      - '.github/workflows/dnd-ai-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KHAOS_AI_ENDPOINT: http://127.0.0.1:8787
      KHAOS_AI_HOMEBREW_COMMIT: 4036c6732061436038d1f9661a6b7e7e8768fac3
    steps:
      - name: Check out Khaos Nexus desktop
        uses: actions/checkout@v4

      - name: Check out validated Khaos Nexus AI homebrew snapshot
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: ${{ env.KHAOS_AI_HOMEBREW_COMMIT }}
          path: ai-service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-service/package-lock.json

      - name: Install AI service
        working-directory: ai-service
        run: npm ci

      - name: Start deterministic AI service
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/khaos-ai-homebrew-data"
          (
            cd ai-service
            AI_PROVIDER=mock \
            PORT=8787 \
            DATA_DIR="$RUNNER_TEMP/khaos-ai-homebrew-data" \
            CORS_ORIGIN=http://localhost \
            npm start >"$RUNNER_TEMP/khaos-ai-homebrew.log" 2>&1
          ) &
          echo $! >"$RUNNER_TEMP/khaos-ai-homebrew.pid"

      - name: Wait for AI service health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$KHAOS_AI_ENDPOINT/health" >"$RUNNER_TEMP/khaos-ai-homebrew-health.json"; then
              cat "$RUNNER_TEMP/khaos-ai-homebrew-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/khaos-ai-homebrew.log" || true
          exit 1

      - name: Verify Co-DM and homebrew contracts
        run: node scripts/verify-dnd-ai-integration.cjs

      - name: Upload AI service log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-ai-homebrew-integration-log
          path: ${{ runner.temp }}/khaos-ai-homebrew.log
          if-no-files-found: ignore

      - name: Stop AI service
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/khaos-ai-homebrew.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/khaos-ai-homebrew.pid")" 2>/dev/null || true
          fi

  map-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KHAOS_AI_ENDPOINT: http://127.0.0.1:8788
      KHAOS_AI_MAP_COMMIT: 32021e678d90271eaf31ba5273103ecb0f562ab2
    steps:
      - name: Check out Khaos Nexus desktop
        uses: actions/checkout@v4

      - name: Check out validated Khaos Nexus AI map snapshot
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: ${{ env.KHAOS_AI_MAP_COMMIT }}
          path: ai-service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
