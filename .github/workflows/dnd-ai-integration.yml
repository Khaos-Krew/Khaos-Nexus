            kill "$(cat "$RUNNER_TEMP/khaos-ai-map.pid")" 2>/dev/null || true
          fi

  ai-gm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KHAOS_AI_ENDPOINT: http://127.0.0.1:8789
      KHAOS_AI_GM_COMMIT: 5524dcbda06c70a51774bdc843a2f9e739f7ba50
    steps:
      - name: Check out Khaos Nexus desktop
        uses: actions/checkout@v4

      - name: Check out validated Khaos Nexus AI Game Master snapshot
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: ${{ env.KHAOS_AI_GM_COMMIT }}
          path: ai-service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-service/package-lock.json

      - name: Install AI service
        working-directory: ai-service
