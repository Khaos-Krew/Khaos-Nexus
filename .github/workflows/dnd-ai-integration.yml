          cache: npm
          cache-dependency-path: ai-service/package-lock.json

      - name: Install AI service
        working-directory: ai-service
        run: npm ci

      - name: Start deterministic map service
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/khaos-ai-map-data"
          (
            cd ai-service
            AI_PROVIDER=mock \
            PORT=8788 \
            DATA_DIR="$RUNNER_TEMP/khaos-ai-map-data" \
            CORS_ORIGIN=http://localhost \
            npm start >"$RUNNER_TEMP/khaos-ai-map.log" 2>&1
          ) &
          echo $! >"$RUNNER_TEMP/khaos-ai-map.pid"

      - name: Wait for AI map service health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$KHAOS_AI_ENDPOINT/health" >"$RUNNER_TEMP/khaos-ai-map-health.json"; then
              cat "$RUNNER_TEMP/khaos-ai-map-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/khaos-ai-map.log" || true
          exit 1

      - name: Verify deterministic map contract
        run: node scripts/verify-dnd-ai-maps-integration.cjs

      - name: Upload map service log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-ai-map-integration-log
          path: ${{ runner.temp }}/khaos-ai-map.log
          if-no-files-found: ignore

      - name: Stop AI map service
        if: always()
        shell: bash
        run: |
