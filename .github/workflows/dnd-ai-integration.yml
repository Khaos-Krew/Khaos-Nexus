      - name: Verify explicit AI Game Master session contract
        run: node scripts/verify-dnd-ai-gm-integration.cjs

      - name: Upload AI Game Master service log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-ai-gm-integration-log
          path: ${{ runner.temp }}/khaos-ai-gm.log
          if-no-files-found: ignore

      - name: Stop AI Game Master service
        if: always()
