name: D&D Standalone Test Build

on:
  workflow_dispatch:
  push:
    branches: ["split/dnd-standalone"]

permissions:
  contents: read

concurrency:
  group: dnd-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime install
        shell: pwsh
        run: |
          node -e "console.log(require('electron'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify standalone source syntax
        shell: pwsh
        run: |
          node --check main/entry-dnd-standalone.cjs
          node --check main/dnd-standalone-shell-extension.cjs
          node --check main/renderer-asset-loader.cjs
          node --check renderer/dnd-standalone-shell.js

      - name: Run D&D and local AI tests
        shell: pwsh
        run: |
          $tests = @()
          $tests += Get-ChildItem test -Filter 'dnd-*.test.cjs'
          $tests += Get-ChildItem test -Filter 'ai-*.test.cjs'
          $tests += Get-ChildItem test -Filter 'bundled-ai-*.test.cjs'
          $tests += Get-ChildItem test -Filter 'embedded-ai-*.test.cjs'
          $paths = $tests.FullName | Sort-Object -Unique
          if (-not $paths -or $paths.Count -eq 0) { throw 'No standalone D&D/AI tests were discovered.' }
          node --test --test-concurrency=1 $paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Smoke-launch packaged D&D portable
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist-dnd -Filter 'Nexus-DnD-Portable-*.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Standalone D&D portable executable was not produced.' }

          $evidence = Join-Path $env:RUNNER_TEMP 'nexus-dnd-startup-smoke.json'
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue
          $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
          $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
          $process = Start-Process -FilePath $portable.FullName -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(80)
            $state = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $evidence) {
                try {
                  $payload = Get-Content $evidence -Raw | ConvertFrom-Json
                  $state = $payload.state
                } catch {}
                if ($state -and $state.completed) { break }
              }
              if ($process.HasExited) { throw "Nexus D&D exited before packaged startup completed (exit $($process.ExitCode))." }
            }

            if (-not $state) { throw 'Nexus D&D did not write packaged startup evidence.' }
            if (-not $state.completed) { throw "Nexus D&D startup did not complete. Phase: $($state.phase); overall: $($state.overall)" }
            if (-not $state.rendererBridgeReady) { throw 'Nexus D&D renderer IPC bridge did not become ready.' }
            if (-not $state.rendererModulesReady) { throw 'Nexus D&D renderer feature modules did not become ready.' }
            if (-not $state.configStoreReady) { throw 'Nexus D&D configuration service did not become ready.' }
            $criticalFailures = @($state.checks | Where-Object { $_.critical -and $_.status -eq 'fail' })
            if ($criticalFailures.Count -gt 0) {
              $detail = ($criticalFailures | ForEach-Object { "$($_.id): $($_.detail)" }) -join '; '
              throw "Nexus D&D packaged startup has critical failures: $detail"
            }
            if ($state.overall -notin @('healthy', 'warning')) { throw "Unexpected Nexus D&D startup health: $($state.overall)" }
            Write-Host "Packaged Nexus D&D startup passed: $($state.overall) / $($state.phase)"
          } catch {
            Write-Host '--- Nexus D&D packaged startup evidence ---'
            if (Test-Path $evidence) { Get-Content $evidence -Raw | Write-Host }
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F 2>$null | Out-Null
            }
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE -ErrorAction SilentlyContinue
          }

      - name: Verify standalone artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-dnd -Filter 'Nexus-DnD-Setup-*.exe'
          $portable = Get-ChildItem dist-dnd -Filter 'Nexus-DnD-Portable-*.exe'
          if (-not $setup) { throw 'Standalone D&D installer was not produced.' }
          if (-not $portable) { throw 'Standalone D&D portable executable was not produced.' }
          Write-Host "Installer: $($setup.Name)"
          Write-Host "Portable: $($portable.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-DnD-Windows-Test
          path: |
            dist-dnd/*.exe
            dist-dnd/*.yml
            dist-dnd/*.blockmap
          retention-days: 14
          if-no-files-found: error