name: Nexus QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "release/**"
      - "release-candidate/**"
      - "work/**"
      - "agent/**"
      - "test/**"
      - "validation/**"

permissions:
  contents: read

concurrency:
  group: nexus-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Full Windows QA
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full Nexus QA
        run: node scripts/qa.cjs full

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qa-${{ github.run_id }}
          path: .validation/qa/
          if-no-files-found: warn
          retention-days: 14
