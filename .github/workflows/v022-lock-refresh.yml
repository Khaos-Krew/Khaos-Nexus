name: v0.22.0 Lockfile Artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile dependency roots
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const root = lock.packages?.[''] || {};
          for (const name of ['discord.js', 'electron-updater', 'qrcode', 'selfsigned']) {
            if (!root.dependencies?.[name]) throw new Error(`Missing locked dependency: ${name}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.22.0-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
