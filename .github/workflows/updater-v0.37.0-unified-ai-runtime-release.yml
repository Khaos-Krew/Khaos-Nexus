name: Approved v0.37.0 Unified AI Runtime Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - release/v0.35.0-B

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.37.0
  cancel-in-progress: true

jobs:
  publish-windows-unified-ai:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.37.0' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      APPROVED_APP_SHA: 952deee11b61bb569d9fe6cbc33319bf9701fbc4
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASE_VERSION: 0.37.0
      RELEASE_TAG: v0.37.0
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved application source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $expected = '.github/workflows/updater-v0.37.0-unified-ai-runtime-release.yml'
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "Publisher must be workflow-only. Changed: $($changed -join ', ')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate authoritative source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.37.0 release identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel

          Khaos Nexus now uses one supervised AI runtime host with two strongly separated workers.

          **Veyra** is the dedicated D&D Lorewarden and Co-DM. She supports campaigns, characters, encounters, homebrew, maps, and explicit AI Game Master sessions. Veyra cannot access application diagnostics, maintenance authority, or system credentials.

          **Nexus Sentinel** is the system-health and assistance AI. It supports diagnostics, update intelligence, module guidance, and advisory maintenance proposals. Nexus Sentinel cannot access campaign, character, homebrew, or DM-only context.

          Each agent retains its own process, private data directory, endpoint, token boundary, readiness contract, logs, tools, memory, and restart path. Either worker can fail or restart without terminating the other worker or the shared host.

          The protected publisher silently installs the application, launches it with contaminated inherited AI settings, proves Veyra's listener belongs to that installation, and requires launch-scoped Nexus Sentinel readiness before publication.
          '@ | Set-Content release-notes/v0.37.0.md -Encoding utf8

          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.37.0'
          $p.khaosRelease.displayVersion = '0.37.0'
          $p.khaosRelease.artifactVersion = '0.37.0'
          $p.khaosRelease.publicTag = 'v0.37.0'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.37.0'
          $p.khaosRelease.rollbackTag = 'v0.35.3'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.37.0.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.37.0-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.37.0-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows updater assets
        run: npm run dist:win

      - name: Verify packaged resources and startup
        shell: pwsh
        run: |
          node scripts/verify-packaged-ai-runtimes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-packaged-startup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Silently install and verify both agents under hostile owner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist/Khaos-Nexus-Setup-0.37.0-x64.exe').Path
          $unpackedRoot = (Resolve-Path 'dist/win-unpacked').Path
          $installRoot = 'C:\khaos-nexus-v0370-publisher'
          $profileRoot = 'C:\khaos-nexus-v0370-owner-profile'
          $diagnosticsRoot = Join-Path $env:GITHUB_WORKSPACE 'publisher-diagnostics'

          Remove-Item $installRoot, $profileRoot, $diagnosticsRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $diagnosticsRoot | Out-Null

          function Test-UnderRoot {
            param([string]$Path, [string]$Root)
            if ([string]::IsNullOrWhiteSpace($Path) -or [string]::IsNullOrWhiteSpace($Root)) { return $false }
            try {
              $p = [IO.Path]::GetFullPath($Path).TrimEnd('\')
              $r = [IO.Path]::GetFullPath($Root).TrimEnd('\')
              return $p.Equals($r, [StringComparison]::OrdinalIgnoreCase) -or
                $p.StartsWith($r + '\', [StringComparison]::OrdinalIgnoreCase)
            } catch { return $false }
          }

          function Get-AllProcesses {
            return @(Get-CimInstance -ClassName Win32_Process -ErrorAction SilentlyContinue)
          }

          function Get-ProcessById {
            param([int]$ProcessId)
            return @(Get-CimInstance -ClassName Win32_Process -Filter "ProcessId = $ProcessId" -ErrorAction SilentlyContinue) |
              Select-Object -First 1
          }

          function Get-ProcessesUnderRoots {
            param([string[]]$Roots)
            return @(Get-AllProcesses | Where-Object {
              $process = $_
              $exe = [string]$process.ExecutablePath
              $command = [string]$process.CommandLine
              foreach ($root in $Roots) {
                if ((Test-UnderRoot -Path $exe -Root $root) -or
                    (-not [string]::IsNullOrWhiteSpace($command) -and
                     $command.IndexOf($root, [StringComparison]::OrdinalIgnoreCase) -ge 0)) {
                  return $true
                }
              }
              return $false
            })
          }

          function Stop-ProcessesUnderRoots {
            param([string[]]$Roots)
            foreach ($process in @(Get-ProcessesUnderRoots -Roots $Roots)) {
              Write-Host "Stopping candidate PID $($process.ProcessId): $($process.ExecutablePath)"
              & taskkill.exe /PID $process.ProcessId /T /F 2>$null | Out-Null
            }
          }

          function Capture-Diagnostics {
            param(
              [string]$Reason,
              [bool]$VeyraReady,
              [bool]$SentinelReady,
              [string]$SentinelReadyPath,
              [datetime]$LaunchStarted
            )
            New-Item -ItemType Directory -Force -Path $diagnosticsRoot | Out-Null
            @(
              "reason=$Reason",
              "launchStartedUtc=$($LaunchStarted.ToUniversalTime().ToString('o'))",
              "capturedUtc=$([datetime]::UtcNow.ToString('o'))",
              "veyraReady=$VeyraReady",
              "nexusSentinelReady=$SentinelReady",
              "sentinelReadyPath=$SentinelReadyPath",
              "installRoot=$installRoot",
              "profileRoot=$profileRoot"
            ) | Set-Content (Join-Path $diagnosticsRoot 'status.txt') -Encoding utf8

            Get-AllProcesses |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
              Export-Csv (Join-Path $diagnosticsRoot 'processes.csv') -NoTypeInformation -Encoding utf8

            try {
              Get-NetTCPConnection -ErrorAction Stop |
                Select-Object State, LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess |
                Export-Csv (Join-Path $diagnosticsRoot 'tcp-connections.csv') -NoTypeInformation -Encoding utf8
            } catch {
              $_.Exception.Message | Set-Content (Join-Path $diagnosticsRoot 'tcp-error.txt') -Encoding utf8
            }

            if (Test-Path $profileRoot) {
              $files = @(Get-ChildItem $profileRoot -Recurse -File -Force -ErrorAction SilentlyContinue)
              $files | Select-Object FullName, Length, CreationTimeUtc, LastWriteTimeUtc |
                Export-Csv (Join-Path $diagnosticsRoot 'profile-files.csv') -NoTypeInformation -Encoding utf8
              foreach ($file in $files) {
                if ($file.Length -gt 5MB) { continue }
                if ($file.Extension -notin @('.log','.json','.txt','.yml','.yaml') -and
                    $file.Name -notin @('Local State','Preferences')) { continue }
                $relative = $file.FullName.Substring($profileRoot.Length).TrimStart('\')
                $destination = Join-Path (Join-Path $diagnosticsRoot 'profile') $relative
                New-Item -ItemType Directory -Force -Path ([IO.Path]::GetDirectoryName($destination)) | Out-Null
                Copy-Item $file.FullName $destination -Force -ErrorAction SilentlyContinue
              }
            }
          }

          Stop-ProcessesUnderRoots -Roots @($unpackedRoot, $installRoot)
          Start-Sleep -Seconds 3

          foreach ($listener in @(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue)) {
            $owner = Get-ProcessById -ProcessId ([int]$listener.OwningProcess)
            if ($owner -and ((Test-UnderRoot $owner.ExecutablePath $unpackedRoot) -or
                             (Test-UnderRoot $owner.ExecutablePath $installRoot))) {
              & taskkill.exe /PID $listener.OwningProcess /T /F 2>$null | Out-Null
            } else {
              throw "Port 8787 is occupied by unrelated PID $($listener.OwningProcess): $($owner.ExecutablePath)"
            }
          }
          Start-Sleep -Seconds 2
          if (@(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'Port 8787 remained occupied after cleanup.'
          }

          $install = Start-Process $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with code $($install.ExitCode)." }

          $resources = Join-Path $installRoot 'resources\ai-services'
          node scripts/verify-packaged-ai-runtimes.cjs $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = Join-Path $installRoot 'Khaos Nexus.exe'
          if (-not (Test-Path $appExe)) { throw 'Installed executable is missing.' }

          $roaming = Join-Path $profileRoot 'AppData\Roaming'
          $local = Join-Path $profileRoot 'AppData\Local'
          $temp = Join-Path $profileRoot 'Temp'
          New-Item -ItemType Directory -Force -Path $roaming, $local, $temp | Out-Null

          $names = @(
            'APPDATA','LOCALAPPDATA','TEMP','TMP','NODE_PATH','OPENAI_API_KEY','AI_PROVIDER','PORT',
            'NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS','NEXUS_AI_CORE_PARENT_PID',
            'NEXUS_AI_CORE_SERVICE_TOKEN','NEXUS_AI_CORE_STARTUP_NONCE','NEXUS_AI_CORE_READY_FILE',
            'MONITOR_STATE_FILE','RATE_LIMIT_PER_MINUTE','CAMPAIGN_STORE','AUTH_REQUIRED'
          )
          $previous = @{}
          foreach ($name in $names) { $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }

          $launchStarted = Get-Date
          $veyraReady = $false
          $sentinelReady = $false
          $sentinelFile = ''
          $appProcess = $null

          try {
            $env:APPDATA = $roaming
            $env:LOCALAPPDATA = $local
            $env:TEMP = $temp
            $env:TMP = $temp
            $env:NODE_PATH = 'C:\owner-machine\unexpected-node-path'
            $env:OPENAI_API_KEY = 'must-not-enter-either-agent'
            $env:AI_PROVIDER = 'owner-machine-provider'
            $env:PORT = '1'
            $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = 'not-a-number'
            $env:NEXUS_AI_CORE_PARENT_PID = '1'
            $env:NEXUS_AI_CORE_SERVICE_TOKEN = 'owner-machine-token'
            $env:NEXUS_AI_CORE_STARTUP_NONCE = 'owner-machine-nonce'
            $env:NEXUS_AI_CORE_READY_FILE = 'C:\owner-machine\ready.json'
            $env:MONITOR_STATE_FILE = 'C:\owner-machine\monitor.json'
            $env:RATE_LIMIT_PER_MINUTE = 'broken'
            $env:CAMPAIGN_STORE = 'owner-machine-store'
            $env:AUTH_REQUIRED = 'true'

            $launchStarted = Get-Date
            $appProcess = Start-Process $appExe -ArgumentList '--disable-gpu' -PassThru
            $deadline = (Get-Date).AddSeconds(180)

            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $installedProcesses = @(Get-ProcessesUnderRoots -Roots @($installRoot))
              if (((Get-Date) - $launchStarted).TotalSeconds -gt 10 -and $installedProcesses.Count -eq 0) {
                $exitCode = ''
                try { $appProcess.Refresh(); if ($appProcess.HasExited) { $exitCode = " code=$($appProcess.ExitCode)" } } catch {}
                throw "No installed Khaos Nexus process remained after launch.$exitCode"
              }

              if (-not $veyraReady) {
                try {
                  $health = Invoke-RestMethod 'http://127.0.0.1:8787/health' -TimeoutSec 2
                  foreach ($listener in @(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue)) {
                    $owner = Get-ProcessById -ProcessId ([int]$listener.OwningProcess)
                    if ([string]$health.status -eq 'ok' -and
                        [string]$health.service -eq 'khaos-nexus-ai' -and
                        $owner -and (Test-UnderRoot $owner.ExecutablePath $installRoot)) {
                      $veyraReady = $true
                      Write-Host "Veyra ready on installed PID $($listener.OwningProcess)."
                      break
                    }
                  }
                } catch {}
              }

              if (-not $sentinelReady) {
                $roots = @($profileRoot, (Join-Path $env:USERPROFILE 'AppData\Roaming\Khaos Nexus')) | Select-Object -Unique
                $readyFiles = @()
                foreach ($root in $roots) {
                  if (Test-Path $root) {
                    $readyFiles += Get-ChildItem $root -Recurse -File -Filter 'ready-*.json' -ErrorAction SilentlyContinue |
                      Where-Object { $_.LastWriteTime -ge $launchStarted }
                  }
                }
                foreach ($candidate in @($readyFiles | Sort-Object LastWriteTimeUtc -Descending)) {
                  try {
                    $payload = Get-Content $candidate.FullName -Raw | ConvertFrom-Json
                    if ([string]$payload.event -eq 'nexus-ai-core.ready' -and
                        [string]$payload.service -eq 'khaos-nexus-ai-core' -and
                        [string]$payload.serviceVersion -eq '0.7.0' -and
                        [string]$payload.apiVersion -eq '1' -and
                        [string]$payload.targetService -eq 'nexus-ai-core' -and
                        [string]$payload.host -eq '127.0.0.1' -and
                        [int]$payload.port -gt 0 -and
                        [bool]$payload.boundaries.directDndCallsAllowed -eq $false) {
                      $sentinelReady = $true
                      $sentinelFile = $candidate.FullName
                      Write-Host "Nexus Sentinel ready: $sentinelFile"
                      break
                    }
                  } catch {}
                }
              }

              if ($veyraReady -and $sentinelReady) { break }
            }

            if (-not ($veyraReady -and $sentinelReady)) {
              throw "Installed readiness timed out. Veyra=$veyraReady NexusSentinel=$sentinelReady"
            }
          } catch {
            $reason = $_.Exception.Message
            try {
              Capture-Diagnostics -Reason $reason -VeyraReady $veyraReady -SentinelReady $sentinelReady -SentinelReadyPath $sentinelFile -LaunchStarted $launchStarted
              Write-Host '--- installed runtime status ---'
              Get-Content (Join-Path $diagnosticsRoot 'status.txt') | Write-Host
              Write-Host '--- profile file map ---'
              Get-Content (Join-Path $diagnosticsRoot 'profile-files.csv') -ErrorAction SilentlyContinue | Select-Object -First 200 | Write-Host
            } catch {
              @("diagnosticCaptureFailure=$($_.Exception.Message)", "originalFailure=$reason") |
                Set-Content (Join-Path $diagnosticsRoot 'capture-failure.txt') -Encoding utf8
            }
            throw
          } finally {
            Stop-ProcessesUnderRoots -Roots @($installRoot)
            foreach ($name in $names) {
              if ($null -eq $previous[$name]) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
              else { Set-Item "Env:$name" $previous[$name] }
            }
          }

          @(
            'Installed unified AI runtime passed.',
            "veyraReady=$veyraReady",
            "nexusSentinelReady=$sentinelReady",
            "sentinelReadyPath=$sentinelFile"
          ) | Set-Content (Join-Path $diagnosticsRoot 'success.txt') -Encoding utf8

          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait | Out-Null }
          Remove-Item $installRoot, $profileRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release assets and package identity
        shell: pwsh
        run: |
          $files = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing asset: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.37\.0\s*$') { throw 'latest.yml version mismatch.' }
          if ($latest -notmatch 'Khaos-Nexus-Setup-0\.37\.0-x64\.exe') { throw 'latest.yml installer mismatch.' }
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('dist/win-unpacked/resources/app.asar','package.json'));if(p.version!=='0.37.0'||p.khaosRelease.rollbackTag!=='v0.35.3')throw Error('bad release identity');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mobile = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($mobile) { throw 'Mobile assets leaked into Windows release.' }
          $files | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))"
          } | Set-Content release-checksums.txt

      - name: Publish updater-visible v0.37.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          gh release create v0.37.0 --target $env:RELEASE_SHA --title 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel' --notes-file release-notes/v0.37.0.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.37.0 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.37.0') { throw 'v0.37.0 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @(
            'Khaos-Nexus-Setup-0.37.0-x64.exe',
            'Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'Khaos-Nexus-Portable-0.37.0-x64.exe',
            'latest.yml',
            'release-checksums.txt'
          )) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload installed-runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.37.0-installed-runtime-diagnostics
          if-no-files-found: error
          retention-days: 14
          path: publisher-diagnostics/**

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.37.0-Updater
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.37.0-x64.exe
            dist/latest.yml
            release-checksums.txt
            release-notes/v0.37.0.md
