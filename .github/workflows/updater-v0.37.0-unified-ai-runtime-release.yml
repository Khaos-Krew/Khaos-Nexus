name: Approved v0.37.0 Unified AI Runtime Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "release/v0.35.0-B"

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.37.0
  cancel-in-progress: true

jobs:
  publish-windows-unified-ai:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.37.0' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APPROVED_APP_SHA: 952deee11b61bb569d9fe6cbc33319bf9701fbc4
      DND_AI_COMMIT: 19c718917377d6148f9baaee8ac8dcb937692f32
      AI_CORE_COMMIT: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
      RELEASE_VERSION: 0.37.0
      RELEASE_TAG: v0.37.0
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved v0.37.0 application source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $expected = '.github/workflows/updater-v0.37.0-unified-ai-runtime-release.yml'
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "Publisher may differ only by its workflow. Changed: $($changed -join ', ')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify authoritative embedded AI source
        shell: pwsh
        run: |
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete validation before release mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.37.0 release identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel

          Khaos Nexus now starts one supervised AI runtime host containing two strongly separated agents.

          **Veyra** is the dedicated D&D Lorewarden and Co-DM. She supports campaigns, characters, encounters, homebrew, maps, and explicit AI Game Master sessions. Veyra cannot access application diagnostics, maintenance authority, or system credentials.

          **Nexus Sentinel** is the system-health and assistance AI. It supports diagnostics, update intelligence, module guidance, and advisory maintenance proposals. Nexus Sentinel cannot access campaign, character, homebrew, or DM-only context.

          Each agent retains its own worker process, private data directory, endpoint, token boundary, readiness contract, logs, tools, memory, and restart path. Either worker can fail or restart without terminating the other worker or the shared runtime host.

          This release also replaces the blocked v0.36.1 startup repair. The publisher silently installs the application into a clean Windows directory, launches it with deliberately contaminated inherited AI variables, and requires both Veyra and Nexus Sentinel to reach their verified loopback readiness contracts before publication.

          The isolated D&D AI and Nexus AI Core repositories remain focused bug-reproduction and candidate-fix lanes. The desktop repository remains the authoritative production source. Android Companion and Mobile Gateway remain paused and excluded under ADR-008.
          '@ | Set-Content release-notes/v0.37.0.md -Encoding utf8

          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.37.0'
          $p.khaosRelease.displayVersion = '0.37.0'
          $p.khaosRelease.artifactVersion = '0.37.0'
          $p.khaosRelease.publicTag = 'v0.37.0'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.37.0'
          $p.khaosRelease.rollbackTag = 'v0.35.3'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.37.0.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.37.0-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.37.0-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows updater assets from embedded source
        run: npm run dist:win

      - name: Verify unpacked packaged AI resources
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Require packaged unified runtime startup
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Silently install and verify both agents under hostile owner environment
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/Khaos-Nexus-Setup-0.37.0-x64.exe'
          $installRoot = 'C:\khaos-nexus-v0370-publisher'
          $profileRoot = 'C:\khaos-nexus-v0370-owner-profile'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $profileRoot -Recurse -Force -ErrorAction SilentlyContinue

          Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.ProcessName -like 'Khaos Nexus*'
          } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $resources = Join-Path $installRoot 'resources\ai-services'
          node scripts/verify-packaged-ai-runtimes.cjs $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = Join-Path $installRoot 'Khaos Nexus.exe'
          if (-not (Test-Path -LiteralPath $appExe)) { throw 'Installed Khaos Nexus executable is missing.' }

          $roaming = Join-Path $profileRoot 'AppData\Roaming'
          $local = Join-Path $profileRoot 'AppData\Local'
          $temp = Join-Path $profileRoot 'Temp'
          New-Item -ItemType Directory -Force -Path $roaming, $local, $temp | Out-Null

          $names = @(
            'APPDATA','LOCALAPPDATA','TEMP','TMP','NODE_PATH','OPENAI_API_KEY','AI_PROVIDER','PORT',
            'NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS','NEXUS_AI_CORE_PARENT_PID',
            'NEXUS_AI_CORE_SERVICE_TOKEN','NEXUS_AI_CORE_STARTUP_NONCE','NEXUS_AI_CORE_READY_FILE',
            'MONITOR_STATE_FILE','RATE_LIMIT_PER_MINUTE','CAMPAIGN_STORE','AUTH_REQUIRED'
          )
          $previous = @{}
          foreach ($name in $names) { $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }

          $appProcess = $null
          try {
            $env:APPDATA = $roaming
            $env:LOCALAPPDATA = $local
            $env:TEMP = $temp
            $env:TMP = $temp
            $env:NODE_PATH = 'C:\owner-machine\unexpected-node-path'
            $env:OPENAI_API_KEY = 'must-not-enter-either-agent'
            $env:AI_PROVIDER = 'owner-machine-provider'
            $env:PORT = '1'
            $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = 'not-a-number'
            $env:NEXUS_AI_CORE_PARENT_PID = '1'
            $env:NEXUS_AI_CORE_SERVICE_TOKEN = 'owner-machine-token'
            $env:NEXUS_AI_CORE_STARTUP_NONCE = 'owner-machine-nonce'
            $env:NEXUS_AI_CORE_READY_FILE = 'C:\owner-machine\ready.json'
            $env:MONITOR_STATE_FILE = 'C:\owner-machine\monitor.json'
            $env:RATE_LIMIT_PER_MINUTE = 'broken'
            $env:CAMPAIGN_STORE = 'owner-machine-store'
            $env:AUTH_REQUIRED = 'true'

            $launchStarted = Get-Date
            $appProcess = Start-Process -FilePath $appExe -ArgumentList @('--disable-gpu') -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            $veyraReady = $false
            $sentinelReady = $false
            $sentinelFile = $null

            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Installed Khaos Nexus exited before unified AI readiness with code $($appProcess.ExitCode)."
              }

              if (-not $veyraReady) {
                try {
                  $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
                  if ([string]$health.status -eq 'ok' -and [string]$health.service -eq 'khaos-nexus-ai') {
                    $veyraReady = $true
                    Write-Host 'Installed Veyra reached the verified loopback health contract.'
                  }
                } catch {}
              }

              if (-not $sentinelReady) {
                $candidates = Get-ChildItem -LiteralPath $roaming -Recurse -File -Filter 'ready-*.json' -ErrorAction SilentlyContinue |
                  Where-Object { $_.LastWriteTime -ge $launchStarted } |
                  Sort-Object LastWriteTimeUtc -Descending
                foreach ($candidate in $candidates) {
                  try {
                    $payload = Get-Content -LiteralPath $candidate.FullName -Raw | ConvertFrom-Json
                    if ([string]$payload.event -eq 'nexus-ai-core.ready' -and
                        [string]$payload.service -eq 'khaos-nexus-ai-core' -and
                        [string]$payload.serviceVersion -eq '0.7.0' -and
                        [string]$payload.apiVersion -eq '1' -and
                        [string]$payload.targetService -eq 'nexus-ai-core' -and
                        [string]$payload.host -eq '127.0.0.1' -and
                        [int]$payload.port -gt 0 -and
                        [bool]$payload.boundaries.directDndCallsAllowed -eq $false) {
                      $sentinelReady = $true
                      $sentinelFile = $candidate
                      Write-Host "Installed Nexus Sentinel reached authenticated readiness: $($candidate.FullName)"
                      break
                    }
                  } catch {}
                }
              }

              if ($veyraReady -and $sentinelReady) { break }
            }

            if (-not ($veyraReady -and $sentinelReady)) {
              $logs = Get-ChildItem -LiteralPath $roaming -Recurse -File -Filter '*.log' -ErrorAction SilentlyContinue
              $detail = @($logs | ForEach-Object {
                "[$($_.FullName)]`n$((Get-Content -LiteralPath $_.FullName -Tail 40 -ErrorAction SilentlyContinue) -join "`n")"
              }) -join "`n---`n"
              throw "Installed unified AI runtime failed readiness. Veyra=$veyraReady NexusSentinel=$sentinelReady Logs:`n$detail"
            }
          } finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              & taskkill.exe /PID $appProcess.Id /T /F | Out-Null
            }
            foreach ($name in $names) {
              if ($null -eq $previous[$name]) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
              else { Set-Item "Env:$name" $previous[$name] }
            }
          }

          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $profileRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release assets and package identity
        shell: pwsh
        run: |
          $files = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required release asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty release asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.37\.0\s*$') { throw 'latest.yml does not advertise 0.37.0.' }
          if ($latest -notmatch 'Khaos-Nexus-Setup-0\.37\.0-x64\.exe') { throw 'latest.yml installer name mismatch.' }
          $asar = 'dist/win-unpacked/resources/app.asar'
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('$asar','package.json'));if(p.version!=='0.37.0')throw Error('bad version');if(p.khaosRelease.rollbackTag!=='v0.35.3')throw Error('bad rollback');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $android = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($android) { throw 'Mobile assets leaked into Windows package.' }
          $files | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))"
          } | Set-Content release-checksums.txt

      - name: Publish updater-visible v0.37.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          gh release create v0.37.0 --target $env:RELEASE_SHA --title 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel' --notes-file release-notes/v0.37.0.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Verify latest release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.37.0 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.37.0') { throw 'v0.37.0 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @(
            'Khaos-Nexus-Setup-0.37.0-x64.exe',
            'Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'Khaos-Nexus-Portable-0.37.0-x64.exe',
            'latest.yml',
            'release-checksums.txt'
          )) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.37.0-Updater
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.37.0-x64.exe
            dist/latest.yml
            release-checksums.txt
            release-notes/v0.37.0.md
