name: Embed AI Source Snapshots

on:
  push:
    paths:
      - 'config/embedded-ai-sources.json'
      - 'scripts/sync-embedded-ai-sources.cjs'
      - 'scripts/verify-embedded-ai-sources.cjs'
      - '.github/workflows/embed-ai-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed-ai-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Khaos Nexus branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check out pinned D&D AI source
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI
          ref: 19c718917377d6148f9baaee8ac8dcb937692f32
          path: .vendor/dnd-ai

      - name: Check out pinned Nexus AI Core source
        uses: actions/checkout@v4
        with:
          repository: Khaos-Krew/Khaos-Nexus-AI-Core
          ref: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
          path: .vendor/ai-core

      - name: Synchronize deterministic embedded snapshots
        run: node scripts/sync-embedded-ai-sources.cjs

      - name: Commit embedded source snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai
          if git diff --cached --quiet; then
            echo 'Embedded AI snapshots already match the pinned source commits.'
            exit 0
          fi
          git commit -m 'Embed pinned AI service sources'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate-source:
    needs: synchronize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out synchronized branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify embedded snapshot integrity
        run: node scripts/verify-embedded-ai-sources.cjs

      - name: Validate embedded D&D AI source
        run: npm run build --prefix packages/ai/dnd-ai

      - name: Validate embedded Nexus AI Core source
        run: npm run build --prefix packages/ai/ai-core

      - name: Run desktop tests and checks
        run: |
          npm test
          npm run check

  validate-installed-windows:
    needs: synchronize
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out synchronized branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify and build embedded AI sources
        shell: pwsh
        run: |
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.41.2-B integration candidate identity
        run: node scripts/freeze-v0.41.2-nexus-core.cjs

      - name: Run complete repository validation
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable executable from embedded source
        run: npm run dist:win

      - name: Verify unpacked AI resources
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Require packaged startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Silently install and verify embedded AI resources
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'Khaos-Nexus-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer candidate was not produced.' }
          $installRoot = 'C:\khaos-nexus-embedded-ai-ci'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)." }
          node scripts/verify-packaged-ai-runtimes.cjs (Join-Path $installRoot 'resources\ai-services')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload validated integration candidate
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-embedded-ai-integration
          path: |
            dist/Khaos-Nexus-Setup-*-x64.exe
            dist/Khaos-Nexus-Setup-*-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-*-x64.exe
            dist/latest.yml
            dist/builder-debug.yml
          retention-days: 14
          if-no-files-found: error
