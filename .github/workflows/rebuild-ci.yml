name: Nexus Rebuild CI

on:
  push:
    branches:
      - 'rebuild/**'
  pull_request:
    branches:
      - 'rebuild/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
      - run: npm run dist:update
      - shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath dist/nexus-update-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.installerRequired -ne $false) { throw 'Staged update manifest unexpectedly requires an installer.' }
          $zip = Join-Path dist $manifest.package.name
          if (-not (Test-Path -LiteralPath $zip)) { throw "Update package missing: $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.package.sha256) { throw 'Update package hash does not match manifest.' }
          $probe = Join-Path $env:RUNNER_TEMP 'nexus-update-probe'
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $probe -Force
          if (-not (Test-Path -LiteralPath (Join-Path $probe 'Khaos Nexus.exe'))) { throw 'Update payload is missing Khaos Nexus.exe.' }
          if (-not (Test-Path -LiteralPath (Join-Path $probe 'resources/app.asar'))) { throw 'Update payload is missing resources/app.asar.' }
      - uses: actions/upload-artifact@v4
        with:
          name: khaos-nexus-0.1-windows
          path: |
            dist/*.exe
            dist/*-update.zip
            dist/nexus-update-manifest.json
          if-no-files-found: error
