name: Approved v0.36.1 AI Core Startup Repair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "release/v0.35.0-B"

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.36.1
  cancel-in-progress: true

jobs:
  publish-windows-hotfix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.36.1' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      APPROVED_APP_SHA: 8f142b2f99d02381b7b655e6c822adc95710c917
      DND_AI_COMMIT: 19c718917377d6148f9baaee8ac8dcb937692f32
      AI_CORE_COMMIT: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved v0.36.1 application source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/updater-v0.36.1-ai-core-startup-release.yml') {
            throw "Publisher may differ only by its workflow. Changed: $($changed -join ', ')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify authoritative embedded AI source
        shell: pwsh
        run: |
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete validation before release mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.36.1 release identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.36.1 — AI Core Startup Repair

          This hotfix repairs an owner-device startup failure in Nexus AI Core after v0.36.0.

          Bundled AI sidecars now start behind an explicit environment boundary. The desktop passes only required Windows process fields and the approved service contract, preventing stale machine-level Node options, module paths, provider credentials, or AI Core tuning variables from changing the verified runtime.

          AI Core startup diagnostics are now scoped to the current launch and forwarded into the existing runtime error display with the structured sidecar code and exit code. Stale errors from an earlier launch are ignored.

          The publisher validates the normal packaged application and then silently installs v0.36.1 into a clean Windows directory. That installed copy is launched with deliberately invalid inherited AI Core and Node environment variables and must still produce an authenticated loopback AI Core readiness file before publication can continue.

          D&D AI and Nexus AI Core remain isolated Electron-embedded Node sidecars. Their dedicated repositories remain available for isolated bug reproduction and candidate testing. Android Companion and Mobile Gateway remain paused and excluded under ADR-008.
          '@ | Set-Content release-notes/v0.36.1.md -Encoding utf8
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.36.1'
          $p.khaosRelease.displayVersion = '0.36.1'
          $p.khaosRelease.artifactVersion = '0.36.1'
          $p.khaosRelease.publicTag = 'v0.36.1'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.36.1'
          $p.khaosRelease.rollbackTag = 'v0.35.3'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.36.1 — AI Core Startup Repair'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.36.1.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.36.1-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.36.1-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows updater assets from embedded source
        run: npm run dist:win

      - name: Verify unpacked packaged AI resources
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Require packaged startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Silently install and verify owner-environment AI Core startup
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/Khaos-Nexus-Setup-0.36.1-x64.exe'
          $installRoot = 'C:\khaos-nexus-v0361-publisher'
          $profileRoot = 'C:\khaos-nexus-v0361-owner-profile'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $profileRoot -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $resources = Join-Path $installRoot 'resources\ai-services'
          node scripts/verify-packaged-ai-runtimes.cjs $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = Join-Path $installRoot 'Khaos Nexus.exe'
          if (-not (Test-Path -LiteralPath $appExe)) { throw 'Installed Khaos Nexus executable is missing.' }

          $roaming = Join-Path $profileRoot 'AppData\Roaming'
          $local = Join-Path $profileRoot 'AppData\Local'
          $temp = Join-Path $profileRoot 'Temp'
          New-Item -ItemType Directory -Force -Path $roaming, $local, $temp | Out-Null

          $previous = @{
            APPDATA = $env:APPDATA
            LOCALAPPDATA = $env:LOCALAPPDATA
            TEMP = $env:TEMP
            TMP = $env:TMP
            NODE_PATH = $env:NODE_PATH
            NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS
            RATE_LIMIT_PER_MINUTE = $env:RATE_LIMIT_PER_MINUTE
            OPENAI_API_KEY = $env:OPENAI_API_KEY
          }

          $appProcess = $null
          try {
            $env:APPDATA = $roaming
            $env:LOCALAPPDATA = $local
            $env:TEMP = $temp
            $env:TMP = $temp
            $env:NODE_PATH = 'C:\owner-machine\unexpected-node-path'
            $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = 'not-a-number'
            $env:RATE_LIMIT_PER_MINUTE = 'broken'
            $env:OPENAI_API_KEY = 'must-not-enter-bundled-sidecar'

            $appProcess = Start-Process -FilePath $appExe -ArgumentList @('--disable-gpu') -PassThru
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Installed Khaos Nexus exited before AI Core readiness with code $($appProcess.ExitCode)."
              }
              $ready = Get-ChildItem -LiteralPath $roaming -Recurse -File -Filter 'ready-*.json' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTimeUtc -Descending |
                Select-Object -First 1
              if (-not $ready) { continue }
              try {
                $payload = Get-Content -LiteralPath $ready.FullName -Raw | ConvertFrom-Json
                if ([string]$payload.event -eq 'nexus-ai-core.ready' -and
                    [string]$payload.host -eq '127.0.0.1' -and
                    [int]$payload.port -gt 0 -and
                    [string]$payload.serviceVersion -eq '0.7.0') {
                  Write-Host "Installed AI Core reached readiness despite contaminated parent environment: $($ready.FullName)"
                  break
                }
              } catch {}
              $ready = $null
            }

            if (-not $ready) {
              $logs = Get-ChildItem -LiteralPath $roaming -Recurse -File -Filter 'service.log' -ErrorAction SilentlyContinue
              $detail = @($logs | ForEach-Object {
                "[$($_.FullName)]`n$((Get-Content -LiteralPath $_.FullName -Tail 30 -ErrorAction SilentlyContinue) -join "`n")"
              }) -join "`n---`n"
              throw "Installed Nexus AI Core did not reach readiness under contaminated owner environment. Logs:`n$detail"
            }
          } finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              & taskkill.exe /PID $appProcess.Id /T /F | Out-Null
            }
            foreach ($name in $previous.Keys) {
              if ($null -eq $previous[$name]) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
              else { Set-Item "Env:$name" $previous[$name] }
            }
          }

          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $profileRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release assets and package identity
        shell: pwsh
        run: |
          $files = @(
            'dist/Khaos-Nexus-Setup-0.36.1-x64.exe',
            'dist/Khaos-Nexus-Setup-0.36.1-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.36.1-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required release asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty release asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.36\.1\s*$') { throw 'latest.yml does not advertise 0.36.1.' }
          if ($latest -notmatch 'Khaos-Nexus-Setup-0\.36\.1-x64\.exe') { throw 'latest.yml installer name mismatch.' }
          $asar = 'dist/win-unpacked/resources/app.asar'
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('$asar','package.json'));if(p.version!=='0.36.1')throw Error('bad version');if(p.khaosRelease.rollbackTag!=='v0.35.3')throw Error('bad rollback');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $android = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -eq '.apk' -or $_.Name -match 'Android|Mobile' }
          if ($android) { throw 'Mobile assets leaked into Windows package.' }
          $files | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))"
          } | Set-Content release-checksums.txt

      - name: Publish updater-visible v0.36.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = 'v0.36.1'
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.36.1-x64.exe',
            'dist/Khaos-Nexus-Setup-0.36.1-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.36.1-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          gh release create $tag --target $env:RELEASE_SHA --title 'Khaos Nexus v0.36.1 — AI Core Startup Repair' --notes-file release-notes/v0.36.1.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Verify latest release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.36.1 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.36.1') { throw 'v0.36.1 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @('Khaos-Nexus-Setup-0.36.1-x64.exe','Khaos-Nexus-Setup-0.36.1-x64.exe.blockmap','Khaos-Nexus-Portable-0.36.1-x64.exe','latest.yml','release-checksums.txt')) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.36.1-Updater
          path: |
            dist/Khaos-Nexus-Setup-0.36.1-x64.exe
            dist/Khaos-Nexus-Setup-0.36.1-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.36.1-x64.exe
            dist/latest.yml
            release-checksums.txt
          if-no-files-found: error
