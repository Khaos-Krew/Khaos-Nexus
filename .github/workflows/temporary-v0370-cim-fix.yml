name: Apply v0.37.0 Publisher CIM Fix

on:
  push:
    branches:
      - publish/v0.37.0

permissions:
  contents: write

jobs:
  patch-publisher:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@v4
        with:
          ref: publish/v0.37.0
          fetch-depth: 0

      - name: Correct Windows process inspection and diagnostics preservation
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/updater-v0.37.0-unified-ai-runtime-release.yml')
          source = path.read_text(encoding='utf-8')

          replacements = {
              "$diagnosticsRoot = Join-Path $env:GITHUB_WORKSPACE '.publisher-diagnostics'":
                  "$diagnosticsRoot = Join-Path $env:GITHUB_WORKSPACE 'publisher-diagnostics'",
              "function Get-CandidateProcesses([string[]]$Roots) {\n            return @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {":
                  "function Get-CandidateProcesses {\n            param([string[]]$Roots)\n            return @(Get-CimInstance -ClassName Win32_Process -ErrorAction SilentlyContinue | Where-Object {",
              "function Stop-CandidateProcesses([string[]]$Roots) {\n            foreach ($candidate in @(Get-CandidateProcesses $Roots)) {":
                  "function Stop-CandidateProcesses {\n            param([string[]]$Roots)\n            foreach ($candidate in @(Get-CandidateProcesses -Roots $Roots)) {",
              "Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |":
                  "Get-CimInstance -ClassName Win32_Process -ErrorAction SilentlyContinue |",
              "Get-CimInstance Win32_Process -Filter \"ProcessId=$($listener.OwningProcess)\" -ErrorAction SilentlyContinue":
                  "Get-CimInstance -ClassName Win32_Process -Filter \"ProcessId = $([int]$listener.OwningProcess)\" -ErrorAction SilentlyContinue",
              "Stop-CandidateProcesses $candidateRoots":
                  "Stop-CandidateProcesses -Roots $candidateRoots",
              "Get-CandidateProcesses @($installRoot)":
                  "Get-CandidateProcesses -Roots @($installRoot)",
              "Stop-CandidateProcesses @($installRoot)":
                  "Stop-CandidateProcesses -Roots @($installRoot)",
              "path: .publisher-diagnostics/**":
                  "path: publisher-diagnostics/**",
              "Capture-PublisherDiagnostics $failureReason $veyraReady $sentinelReady $sentinelFile $launchStarted\n            throw":
                  "try {\n              Capture-PublisherDiagnostics $failureReason $veyraReady $sentinelReady $sentinelFile $launchStarted\n              Write-Host '--- Installed runtime diagnostic status ---'\n              Get-Content -LiteralPath (Join-Path $diagnosticsRoot 'status.txt') -ErrorAction SilentlyContinue | Write-Host\n              Write-Host '--- Captured profile files ---'\n              Get-Content -LiteralPath (Join-Path $diagnosticsRoot 'profile-files.csv') -ErrorAction SilentlyContinue | Select-Object -First 200 | Write-Host\n            } catch {\n              Write-Warning \"Diagnostic capture also failed: $($_.Exception.Message)\"\n              @('diagnosticCaptureFailure=' + $_.Exception.Message, 'originalFailure=' + $failureReason) |\n                Set-Content (Join-Path $diagnosticsRoot 'capture-failure.txt') -Encoding utf8\n            }\n            throw"
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count == 0:
                  raise SystemExit(f'Missing expected publisher fragment: {old[:100]}')
              source = source.replace(old, new)

          if 'Get-CimInstance Win32_Process' in source:
              raise SystemExit('A positional Win32_Process CIM invocation remains')
          if '.publisher-diagnostics' in source:
              raise SystemExit('The hidden diagnostics path remains')

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/temporary-v0370-cim-fix.yml').unlink()

      - name: Commit corrected publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix v0.37.0 installed-runtime process inspection"
          git push origin HEAD:publish/v0.37.0

# Triggered after the workflow existed on the branch.
