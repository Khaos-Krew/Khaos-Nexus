name: Approved v0.37.0 Manual AI Test Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["release/v0.35.0-B"]

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.37.0-manual-ai
  cancel-in-progress: true

jobs:
  publish-windows-manual-ai:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.37.0-manual-start' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      APPROVED_APP_SHA: ec7f26d56f7f24cc2b1b9e6d0d3f4ce355e54c98
      RELEASE_VERSION: 0.37.0
      RELEASE_TAG: v0.37.0
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved manual-start source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $expected = '.github/workflows/updater-v0.37.0-manual-ai-test-release.yml'
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "Publisher differs outside its workflow: $($changed -join ', ')"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate exact application and embedded agents
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/ai-runtime-manual-start.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.37.0 Owner-test identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test

          The desktop now opens with the Khaos Nexus AI Runtime fully stopped. The host, Veyra, and Nexus Sentinel launch only after the Owner selects **Start Khaos Nexus AI Runtime** inside the app.

          Veyra remains the isolated D&D Lorewarden and Co-DM. Nexus Sentinel remains the isolated system-health and assistance AI. Their processes, data, credentials, endpoints, logs, tools, memory, restart paths, and failure boundaries remain separate.

          This is an Owner test release. Issue #214 remains open until the installed update and manual in-app AI start are confirmed. Rollback remains v0.35.3.
          '@ | Set-Content release-notes/v0.37.0.md -Encoding utf8
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.37.0'
          $p.khaosRelease.displayVersion = '0.37.0'
          $p.khaosRelease.artifactVersion = '0.37.0'
          $p.khaosRelease.publicTag = 'v0.37.0'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.37.0'
          $p.khaosRelease.rollbackTag = 'v0.35.3'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.37.0.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.37.0-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.37.0-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build and verify Windows package
        shell: pwsh
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-packaged-ai-runtimes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-packaged-startup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Silently install and prove AI remains stopped
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/Khaos-Nexus-Setup-0.37.0-x64.exe'
          $installRoot = 'C:\khaos-nexus-v0370-manual-test'
          $smokeRoot = 'C:\khaos-nexus-v0370-manual-smoke'
          $evidence = Join-Path $smokeRoot 'startup-health.json'
          $profile = Join-Path $env:APPDATA 'khaos-nexus'
          Remove-Item $installRoot,$smokeRoot,$profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like 'Khaos Nexus*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $install = Start-Process $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed: $($install.ExitCode)" }
          node scripts/verify-packaged-ai-runtimes.cjs (Join-Path $installRoot 'resources\ai-services')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appExe = Join-Path $installRoot 'Khaos Nexus.exe'
          if (-not (Test-Path $appExe)) { throw 'Installed executable is missing.' }

          $names = @('KHAOS_PACKAGED_STARTUP_SMOKE','KHAOS_PACKAGED_STARTUP_SMOKE_FILE','NODE_PATH','OPENAI_API_KEY','AI_PROVIDER','PORT','NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS','NEXUS_AI_CORE_PARENT_PID','NEXUS_AI_CORE_SERVICE_TOKEN','NEXUS_AI_CORE_STARTUP_NONCE','NEXUS_AI_CORE_READY_FILE','MONITOR_STATE_FILE','RATE_LIMIT_PER_MINUTE','CAMPAIGN_STORE','AUTH_REQUIRED')
          $previous = @{}
          foreach ($name in $names) { $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          $appProcess = $null
          try {
            $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
            $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
            $env:NODE_PATH = 'C:\owner-machine\unexpected-node-path'
            $env:OPENAI_API_KEY = 'must-not-enter-either-agent'
            $env:AI_PROVIDER = 'owner-machine-provider'
            $env:PORT = '1'
            $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = 'not-a-number'
            $env:NEXUS_AI_CORE_PARENT_PID = '1'
            $env:NEXUS_AI_CORE_SERVICE_TOKEN = 'owner-machine-token'
            $env:NEXUS_AI_CORE_STARTUP_NONCE = 'owner-machine-nonce'
            $env:NEXUS_AI_CORE_READY_FILE = 'C:\owner-machine\ready.json'
            $env:MONITOR_STATE_FILE = 'C:\owner-machine\monitor.json'
            $env:RATE_LIMIT_PER_MINUTE = 'broken'
            $env:CAMPAIGN_STORE = 'owner-machine-store'
            $env:AUTH_REQUIRED = 'true'

            $launchStarted = Get-Date
            $appProcess = Start-Process $appExe -ArgumentList '--disable-gpu' -PassThru
            $deadline = (Get-Date).AddSeconds(95)
            $lastState = $null
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw "Installed desktop exited: $($appProcess.ExitCode)" }
              if (-not (Test-Path $evidence)) { continue }
              try { $lastState = (Get-Content $evidence -Raw | ConvertFrom-Json).state } catch { continue }
              if ([string]$lastState.phase -eq 'ready' -and $lastState.released -eq $true -and $lastState.completed -eq $true -and $lastState.releaseAllowed -eq $true -and $lastState.limitedMode -ne $true -and $lastState.rendererBridgeReady -eq $true -and $lastState.rendererModulesReady -eq $true -and $lastState.configStoreReady -eq $true) { $ready = $true; break }
              if ($lastState.limitedMode -eq $true -or [string]$lastState.overall -eq 'failed') { throw "Installed desktop startup failed: $($lastState | ConvertTo-Json -Depth 8 -Compress)" }
            }
            if (-not $ready) { throw "Installed desktop did not become ready: $(if ($lastState) { $lastState | ConvertTo-Json -Depth 8 -Compress } else { 'no evidence' })" }
            Start-Sleep -Seconds 5

            $processes = @(Get-CimInstance -ClassName Win32_Process | Where-Object { ([string]$_.ExecutablePath).StartsWith($installRoot,[StringComparison]::OrdinalIgnoreCase) -or ([string]$_.CommandLine).Contains($installRoot,[StringComparison]::OrdinalIgnoreCase) })
            $ai = @($processes | Where-Object { [string]$_.CommandLine -match 'ai-runtime-host\.cjs|ai-runtime-agent-launcher\.cjs|khaos-nexus-ai-core|khaos-nexus-dnd-ai' })
            if ($ai.Count) { throw "AI started without Owner action: $($ai.CommandLine -join ' | ')" }

            $owned8787 = @()
            foreach ($listener in @(Get-NetTCPConnection -State Listen -LocalPort 8787 -ErrorAction SilentlyContinue)) {
              $owner = Get-CimInstance -ClassName Win32_Process -Filter "ProcessId=$($listener.OwningProcess)" -ErrorAction SilentlyContinue
              if ($owner -and (([string]$owner.ExecutablePath).StartsWith($installRoot,[StringComparison]::OrdinalIgnoreCase) -or [string]$owner.CommandLine -match 'khaos-nexus-dnd-ai|ai-runtime-agent-launcher')) { $owned8787 += $owner }
            }
            if ($owned8787.Count) { throw 'Veyra opened port 8787 without an Owner action.' }

            $freshReady = @(Get-ChildItem $profile -Recurse -File -Filter 'ready-*.json' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $launchStarted })
            if ($freshReady.Count) { throw "Sentinel readiness appeared without Owner action: $($freshReady.FullName -join ', ')" }
            $logs = @(Get-ChildItem (Join-Path $profile 'ai-services') -Recurse -File -Filter 'service.log' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $launchStarted })
            if ($logs.Count) { throw "AI logs appeared without Owner action: $($logs.FullName -join ', ')" }
            Write-Host "Installed desktop ready with AI Runtime stopped. PID $($appProcess.Id)."
          } finally {
            if ($appProcess -and -not $appProcess.HasExited) { & taskkill.exe /PID $appProcess.Id /T /F | Out-Null }
            foreach ($name in $names) { if ($null -eq $previous[$name]) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue } else { Set-Item "Env:$name" $previous[$name] } }
          }
          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait | Out-Null }
          Remove-Item $installRoot,$smokeRoot,$profile -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release assets and identity
        shell: pwsh
        run: |
          $files = @('dist/Khaos-Nexus-Setup-0.37.0-x64.exe','dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap','dist/Khaos-Nexus-Portable-0.37.0-x64.exe','dist/latest.yml')
          foreach ($file in $files) { if (-not (Test-Path $file) -or (Get-Item $file).Length -le 0) { throw "Invalid release asset: $file" } }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.37\.0\s*$' -or $latest -notmatch 'Khaos-Nexus-Setup-0\.37\.0-x64\.exe') { throw 'Updater metadata is invalid.' }
          $asar = 'dist/win-unpacked/resources/app.asar'
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('$asar','package.json'));if(p.version!=='0.37.0'||p.khaosRelease.rollbackTag!=='v0.35.3')throw Error('bad identity')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files | ForEach-Object { "$( (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))" } | Set-Content release-checksums.txt

      - name: Publish and verify updater-visible v0.37.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $assets = @('dist/Khaos-Nexus-Setup-0.37.0-x64.exe','dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap','dist/Khaos-Nexus-Portable-0.37.0-x64.exe','dist/latest.yml','release-checksums.txt')
          gh release create v0.37.0 --target $env:RELEASE_SHA --title 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test' --notes-file release-notes/v0.37.0.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.37.0 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.37.0') { throw 'v0.37.0 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @('Khaos-Nexus-Setup-0.37.0-x64.exe','Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap','Khaos-Nexus-Portable-0.37.0-x64.exe','latest.yml','release-checksums.txt')) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.37.0-Manual-AI-Test
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.37.0-x64.exe
            dist/latest.yml
            release-checksums.txt
            release-notes/v0.37.0.md

