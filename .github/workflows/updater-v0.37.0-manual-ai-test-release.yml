name: Approved v0.37.0 Manual AI Test Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "release/v0.35.0-B"

permissions:
  contents: write
  issues: write

concurrency:
  group: approved-updater-v0.37.0-manual-ai
  cancel-in-progress: true

jobs:
  publish-windows-manual-ai:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/v0.37.0-manual-start' &&
      github.event.pull_request.base.ref == 'release/v0.35.0-B'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      APPROVED_APP_SHA: ec7f26d56f7f24cc2b1b9e6d0d3f4ce355e54c98
      DND_AI_COMMIT: 19c718917377d6148f9baaee8ac8dcb937692f32
      AI_CORE_COMMIT: 300c653e5643e0ee2e15590f8cb53e30ee7a79ff
      RELEASE_VERSION: 0.37.0
      RELEASE_TAG: v0.37.0
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow-only lineage
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:APPROVED_APP_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved manual-start application source is not an ancestor.' }
          $changed = @(git diff --name-only "$env:APPROVED_APP_SHA..HEAD")
          $expected = '.github/workflows/updater-v0.37.0-manual-ai-test-release.yml'
          if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
            throw "Publisher may differ only by its workflow. Changed: $($changed -join ', ')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify authoritative embedded AI source
        shell: pwsh
        run: |
          node scripts/verify-embedded-ai-sources.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/dnd-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix packages/ai/ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete application validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/ai-runtime-manual-start.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          'use strict';
          const originalFetch = global.fetch;
          global.fetch = (url, options = {}) => {
            const headers = new Headers(options.headers || {});
            if (/^https:\/\/(api\.)?github\.com\//i.test(String(url))) {
              headers.set('authorization', `Bearer ${process.env.GH_TOKEN}`);
              headers.set('x-github-api-version', '2022-11-28');
            }
            return originalFetch(url, { ...options, headers });
          };
          require('./scripts/verify-diagnostics-runtime-release.cjs');
          '@ | Set-Content .github-diagnostics-auth.cjs -Encoding utf8
          node .github-diagnostics-auth.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze v0.37.0 test-release identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-notes | Out-Null
          @'
          # Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test

          This updater delivers the unified Khaos Nexus AI Runtime for Owner-device testing.

          The desktop application now opens with the AI Runtime fully stopped. The runtime host, Veyra, and Nexus Sentinel do not launch with Windows desktop startup. Use **Start Khaos Nexus AI Runtime** inside Khaos Nexus when you are ready to test them.

          **Veyra** is the isolated D&D Lorewarden and Co-DM. **Nexus Sentinel** is the isolated system-health and assistance AI. Each retains separate worker processes, private data, credentials, endpoints, logs, tools, memory, restart paths, and failure boundaries.

          The release gate verifies the installed desktop reaches full readiness while no AI host, launcher, readiness file, or Veyra listener exists. The Owner will then start the runtime manually in-app and report the result. Issue #214 remains open during that test.

          Rollback remains v0.35.3.
          '@ | Set-Content release-notes/v0.37.0.md -Encoding utf8

          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.37.0'
          $p.khaosRelease.displayVersion = '0.37.0'
          $p.khaosRelease.artifactVersion = '0.37.0'
          $p.khaosRelease.publicTag = 'v0.37.0'
          $p.khaosRelease.channel = 'beta'
          $p.khaosRelease.updaterVersion = '0.37.0'
          $p.khaosRelease.rollbackTag = 'v0.35.3'
          $p.build.releaseInfo.releaseName = 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test'
          $p.build.releaseInfo.releaseNotesFile = 'release-notes/v0.37.0.md'
          $p.build.nsis.artifactName = 'Khaos-Nexus-Setup-0.37.0-${arch}.${ext}'
          $p.build.portable.artifactName = 'Khaos-Nexus-Portable-0.37.0-${arch}.${ext}'
          $p | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Build Windows updater assets
        run: npm run dist:win

      - name: Verify unpacked packaged AI resources
        run: node scripts/verify-packaged-ai-runtimes.cjs

      - name: Require normal packaged desktop startup
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1

      - name: Silently install and prove AI remains stopped
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist/Khaos-Nexus-Setup-0.37.0-x64.exe'
          $installRoot = 'C:\khaos-nexus-v0370-manual-test'
          $smokeRoot = 'C:\khaos-nexus-v0370-manual-smoke'
          $evidence = Join-Path $smokeRoot 'startup-health.json'
          $actualProfile = Join-Path $env:APPDATA 'khaos-nexus'

          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $actualProfile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.ProcessName -like 'Khaos Nexus*'
          } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $resources = Join-Path $installRoot 'resources\ai-services'
          node scripts/verify-packaged-ai-runtimes.cjs $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = Join-Path $installRoot 'Khaos Nexus.exe'
          if (-not (Test-Path -LiteralPath $appExe)) { throw 'Installed Khaos Nexus executable is missing.' }

          $names = @(
            'KHAOS_PACKAGED_STARTUP_SMOKE','KHAOS_PACKAGED_STARTUP_SMOKE_FILE','NODE_PATH','OPENAI_API_KEY',
            'AI_PROVIDER','PORT','NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS','NEXUS_AI_CORE_PARENT_PID',
            'NEXUS_AI_CORE_SERVICE_TOKEN','NEXUS_AI_CORE_STARTUP_NONCE','NEXUS_AI_CORE_READY_FILE',
            'MONITOR_STATE_FILE','RATE_LIMIT_PER_MINUTE','CAMPAIGN_STORE','AUTH_REQUIRED'
          )
          $previous = @{}
          foreach ($name in $names) { $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }

          $appProcess = $null
          try {
            $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
            $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
            $env:NODE_PATH = 'C:\owner-machine\unexpected-node-path'
            $env:OPENAI_API_KEY = 'must-not-enter-either-agent'
            $env:AI_PROVIDER = 'owner-machine-provider'
            $env:PORT = '1'
            $env:NEXUS_AI_CORE_PARENT_CHECK_INTERVAL_MS = 'not-a-number'
            $env:NEXUS_AI_CORE_PARENT_PID = '1'
            $env:NEXUS_AI_CORE_SERVICE_TOKEN = 'owner-machine-token'
            $env:NEXUS_AI_CORE_STARTUP_NONCE = 'owner-machine-nonce'
            $env:NEXUS_AI_CORE_READY_FILE = 'C:\owner-machine\ready.json'
            $env:MONITOR_STATE_FILE = 'C:\owner-machine\monitor.json'
            $env:RATE_LIMIT_PER_MINUTE = 'broken'
            $env:CAMPAIGN_STORE = 'owner-machine-store'
            $env:AUTH_REQUIRED = 'true'

            $launchStarted = Get-Date
            $appProcess = Start-Process -FilePath $appExe -ArgumentList @('--disable-gpu') -PassThru
            $deadline = (Get-Date).AddSeconds(95)
            $lastState = $null
            $ready = $false

            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Installed Khaos Nexus exited during startup with code $($appProcess.ExitCode)."
              }
              if (-not (Test-Path -LiteralPath $evidence)) { continue }
              try {
                $payload = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
                $lastState = $payload.state
              } catch { continue }
              if ([string]$lastState.phase -eq 'ready' -and
                  $lastState.released -eq $true -and
                  $lastState.completed -eq $true -and
                  $lastState.releaseAllowed -eq $true -and
                  $lastState.limitedMode -ne $true -and
                  $lastState.rendererBridgeReady -eq $true -and
                  $lastState.rendererModulesReady -eq $true -and
                  $lastState.configStoreReady -eq $true) {
                $ready = $true
                break
              }
              if ($lastState.limitedMode -eq $true -or [string]$lastState.overall -eq 'failed') {
                throw "Installed desktop entered a failed or limited startup state: $($lastState | ConvertTo-Json -Depth 8 -Compress)"
              }
            }

            if (-not $ready) {
              $summary = if ($lastState) { $lastState | ConvertTo-Json -Depth 8 -Compress } else { 'No startup-health evidence.' }
              throw "Installed desktop did not reach full readiness. Last state: $summary"
            }

            Start-Sleep -Seconds 5
            $appProcess.Refresh()
            if ($appProcess.HasExited) { throw 'Installed desktop exited after reporting readiness.' }

            $processes = @(Get-CimInstance -ClassName Win32_Process | Where-Object {
              ([string]$_.ExecutablePath).StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
              ([string]$_.CommandLine).Contains($installRoot, [System.StringComparison]::OrdinalIgnoreCase)
            })
            $aiProcesses = @($processes | Where-Object {
              [string]$command = [string]$_.CommandLine
              $command -match 'ai-runtime-host\.cjs|ai-runtime-agent-launcher\.cjs|khaos-nexus-ai-core|khaos-nexus-dnd-ai'
            })
            if ($aiProcesses.Count -gt 0) {
              $detail = $aiProcesses | ForEach-Object { "PID=$($_.ProcessId) $($_.CommandLine)" }
              throw "AI processes started without an in-app Owner action: $($detail -join ' | ')"
            }

            $veyraListener = Get-NetTCPConnection -State Listen -LocalPort 8787 -ErrorAction SilentlyContinue
            if ($veyraListener) { throw 'Veyra opened port 8787 during desktop startup without an Owner action.' }

            $freshReady = @(Get-ChildItem -LiteralPath $actualProfile -Recurse -File -Filter 'ready-*.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $launchStarted })
            if ($freshReady.Count -gt 0) {
              throw "Nexus Sentinel readiness evidence appeared without an Owner action: $($freshReady.FullName -join ', ')"
            }

            $runtimeLogs = @(Get-ChildItem -LiteralPath (Join-Path $actualProfile 'ai-services') -Recurse -File -Filter 'service.log' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $launchStarted })
            if ($runtimeLogs.Count -gt 0) {
              throw "AI Runtime logs were created during desktop startup without an Owner action: $($runtimeLogs.FullName -join ', ')"
            }

            Write-Host "Installed desktop reached full readiness with AI Runtime stopped. PID $($appProcess.Id)."
          } finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              & taskkill.exe /PID $appProcess.Id /T /F | Out-Null
            }
            foreach ($name in $names) {
              if ($null -eq $previous[$name]) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
              else { Set-Item "Env:$name" $previous[$name] }
            }
          }

          $uninstaller = Join-Path $installRoot 'Uninstall Khaos Nexus.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          }
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $actualProfile -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release assets and package identity
        shell: pwsh
        run: |
          $files = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required release asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty release asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch '(?m)^version:\s*0\.37\.0\s*$') { throw 'latest.yml does not advertise 0.37.0.' }
          if ($latest -notmatch 'Khaos-Nexus-Setup-0\.37\.0-x64\.exe') { throw 'latest.yml installer name mismatch.' }
          $asar = 'dist/win-unpacked/resources/app.asar'
          node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('$asar','package.json'));if(p.version!=='0.37.0')throw Error('bad version');if(p.khaosRelease.rollbackTag!=='v0.35.3')throw Error('bad rollback');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))"
          } | Set-Content release-checksums.txt

      - name: Publish updater-visible v0.37.0 Owner test
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $assets = @(
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe',
            'dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'dist/Khaos-Nexus-Portable-0.37.0-x64.exe',
            'dist/latest.yml',
            'release-checksums.txt'
          )
          gh release create v0.37.0 --target $env:RELEASE_SHA --title 'Khaos Nexus v0.37.0 — Veyra and Nexus Sentinel Owner Test' --notes-file release-notes/v0.37.0.md --latest @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Verify latest release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ref = gh api repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.37.0 | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:RELEASE_SHA) { throw 'Tag target mismatch.' }
          $latest = gh api repos/$env:GITHUB_REPOSITORY/releases/latest | ConvertFrom-Json
          if ([string]$latest.tag_name -ne 'v0.37.0') { throw 'v0.37.0 is not latest.' }
          $names = @($latest.assets | ForEach-Object name)
          foreach ($name in @(
            'Khaos-Nexus-Setup-0.37.0-x64.exe',
            'Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap',
            'Khaos-Nexus-Portable-0.37.0-x64.exe',
            'latest.yml',
            'release-checksums.txt'
          )) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-v0.37.0-Manual-AI-Test
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe
            dist/Khaos-Nexus-Setup-0.37.0-x64.exe.blockmap
            dist/Khaos-Nexus-Portable-0.37.0-x64.exe
            dist/latest.yml
            release-checksums.txt
            release-notes/v0.37.0.md
# Owner-test publisher head marker
