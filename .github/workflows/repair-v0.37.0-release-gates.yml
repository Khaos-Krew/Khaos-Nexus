name: Repair v0.37.0 Release Gates

on:
  push:
    branches:
      - hotfix/v0.37.0-release-gates

permissions:
  contents: write

concurrency:
  group: repair-v0.37.0-release-gates
  cancel-in-progress: true

jobs:
  repair-lock-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v0.37.0-release-gates
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair dependency lock
        run: npm audit fix --package-lock-only

      - name: Validate production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate manual AI start regression
        run: node --test test/ai-runtime-manual-start.test.cjs

      - name: Validate repository tests and checks
        run: |
          npm ci
          npm test
          npm run check

      - name: Commit repaired lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Repair v0.37.0 dependency audit lock"
          git push origin HEAD:hotfix/v0.37.0-release-gates
