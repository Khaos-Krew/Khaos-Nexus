name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "agent/**", "rollback/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Build installer and portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
      - name: Build tagged Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $customTag = [string]$package.khaosRelease.publicTag
          if ($customTag) {
            if ($env:GITHUB_REF_NAME -ne $customTag) {
              throw "Custom release tag mismatch: expected $customTag, received $env:GITHUB_REF_NAME"
            }
            Write-Host "Custom public tag $customTag is owned by its protected publisher; rebuilding assets without creating a second release."
            npm run dist:win
          } else {
            npm run release:win
          }
          if ($LASTEXITCODE -ne 0) { throw "Tagged Windows build failed." }
      - name: Smoke-test packaged full startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $artifactVersion = [string]$package.version
          if ($null -ne $package.khaosRelease -and $package.khaosRelease.artifactVersion) {
            $artifactVersion = [string]$package.khaosRelease.artifactVersion
          } elseif ($null -ne $package.build.extraMetadata -and $package.build.extraMetadata.version) {
            $artifactVersion = [string]$package.build.extraMetadata.version
          }
          $expected = @(
            "dist/Khaos-Nexus-Setup-$artifactVersion-x64.exe",
            "dist/Khaos-Nexus-Portable-$artifactVersion-x64.exe"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required Windows artifact: $path" }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -lt 1MB) { throw "Windows artifact is unexpectedly small: $path" }
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $path
            Write-Host "$($item.Name) | $($item.Length) bytes | SHA256 $($hash.Hash)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
