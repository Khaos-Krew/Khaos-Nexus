name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Build installer and portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
      - name: Build and publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Windows artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $artifactVersion = [string]$package.version
          if ($null -ne $package.build.extraMetadata -and $package.build.extraMetadata.version) {
            $artifactVersion = [string]$package.build.extraMetadata.version
          }
          $expected = @(
            "dist/Khaos-Nexus-Setup-$artifactVersion-x64.exe",
            "dist/Khaos-Nexus-Portable-$artifactVersion-x64.exe"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required Windows artifact: $path" }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -lt 1MB) { throw "Windows artifact is unexpectedly small: $path" }
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $path
            Write-Host "$($item.Name) | $($item.Length) bytes | SHA256 $($hash.Hash)"
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Khaos-Nexus-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
