name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "agent/**", "rollback/**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Electron build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-windows-
      - run: npm ci
      - name: Run tests
        shell: pwsh
        run: |
          cmd.exe /d /s /c "npm test > test-output.txt 2>&1"
          $testExitCode = $LASTEXITCODE
          Get-Content -LiteralPath test-output.txt
          if ($testExitCode -ne 0) { exit $testExitCode }
      - name: Upload failed Windows test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: test-output.txt
          retention-days: 7
          if-no-files-found: warn
      - run: npm run check
      - name: Build installer and portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win
      - name: Build tagged Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $customTag = [string]$package.khaosRelease.publicTag
          if ($customTag) {
            if ($env:GITHUB_REF_NAME -ne $customTag) {
              throw "Custom release tag mismatch: expected $customTag, received $env:GITHUB_REF_NAME"
            }
            Write-Host "Custom public tag $customTag is owned by its protected publisher; rebuilding assets without creating a second release."
            npm run dist:win
          } else {
            npm run release:win
          }
          if ($LASTEXITCODE -ne 0) { throw "Tagged Windows build failed." }
      - name: Audit packaged app contents
        run: node scripts/audit-packaged-contents.cjs
      - name: Smoke-test packaged full startup readiness
        shell: pwsh
        run: ./scripts/smoke-packaged-startup.ps1
      - name: Smoke-test clean installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: ./scripts/smoke-installed-build.ps1
      - name: Verify Windows release artifacts and write manifest
        env:
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
        run: node scripts/verify-release-artifacts.cjs
      - name: Verify Windows Authenticode policy
        shell: pwsh
        env:
          KHAOS_REQUIRE_SIGNING: ${{ vars.KHAOS_REQUIRE_SIGNING }}
        run: ./scripts/verify-windows-signatures.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Khaos-Nexus-Windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/release-manifest.json
            dist/package-content-audit.json
            dist/signing-audit.json
          if-no-files-found: error
