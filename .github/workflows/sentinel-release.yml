name: Nexus Sentinel Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sentinel release tag, for example v0.33.0-sentinel
        required: true
        type: string
  push:
    tags:
      - 'v*-sentinel'

permissions:
  contents: write

concurrency:
  group: nexus-sentinel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve and validate Sentinel tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = node -p "require('./package.json').version"
          $expected = "v$version-sentinel"
          if ($tag -ne $expected) { throw "Sentinel release tag '$tag' must equal '$expected'." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        run: npm ci

      - name: Validate full Sentinel roadmap source
        shell: pwsh
        run: |
          node --check main/entry.cjs
          node --check main/sentinel-scope-extension.cjs
          node --check main/sentinel-production-update-extension.cjs
          node --check main/sentinel-lifecycle-extension.cjs
          node --check renderer/sentinel-scope.js
          node --check renderer/sentinel-navigation-guard.js
          node --check renderer/sentinel-roadmap.js
          node --check renderer/sentinel-live-copy.js
          node --check shared/sentinel-update-policy.cjs
          node --check scripts/write-sentinel-checksums.cjs

      - name: Run full Sentinel acceptance suite
        shell: pwsh
        run: |
          $tests = @(
            'test/sentinel-scope.test.cjs',
            'test/sentinel-roadmap-hardening.test.cjs',
            'test/sentinel-update-policy.test.cjs',
            'test/sentinel-production-update.test.cjs',
            'test/palworld-rest.test.cjs',
            'test/server-client.test.cjs',
            'test/game-adapter-sdk.test.cjs',
            'test/player-console.test.cjs',
            'test/status-panels.test.cjs',
            'test/module-runtime-control.test.cjs',
            'test/application-monitor.test.cjs',
            'test/discord-auth.test.cjs',
            'test/discord-automation.test.cjs',
            'test/discord-automation-layout-edge.test.cjs',
            'test/discord-observability.test.cjs',
            'test/discord-observability-service.test.cjs',
            'test/discord-studio.test.cjs',
            'test/discord-studio-service.test.cjs',
            'test/redaction.test.cjs',
            'test/rcon-protocol.test.cjs',
            'test/rcon-guidance.test.cjs',
            'test/startup-health.test.cjs',
            'test/interface-watchdog.test.cjs',
            'test/window-visibility.test.cjs'
          )
          node --test --test-concurrency=1 $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Sentinel installer and portable executable
        run: npm run dist:win

      - name: Generate SHA-256 release manifest
        run: npm run sentinel:checksums

      - name: Verify release payload
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $required = @(
            "dist/Khaos-Nexus-Sentinel-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-Portable-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-$version-sha256.json"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing Sentinel release asset: $file" } }
          Get-Content "dist/Khaos-Nexus-Sentinel-$version-sha256.json" -Raw | ConvertFrom-Json | Out-Null

      - name: Create Sentinel GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $title = "Nexus Sentinel $version"
          $notes = @"
          Nexus Sentinel Windows release $version.

          Product scope: Discord + Palworld.
          Update channel: sentinel.
          Includes staged SHA-256 verified updates, verified pre-update backup, startup-health validation, and automatic rollback.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to overwrite a production Sentinel release." }
          gh release create $tag `
            "dist/Khaos-Nexus-Sentinel-Setup-$version-x64.exe" `
            "dist/Khaos-Nexus-Sentinel-Portable-$version-x64.exe" `
            "dist/Khaos-Nexus-Sentinel-$version-sha256.json" `
            --title $title `
            --notes $notes `
            --latest=false
