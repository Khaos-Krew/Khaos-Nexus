name: Nexus Sentinel Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sentinel release tag, for example v0.33.0-sentinel
        required: true
        type: string
  push:
    tags:
      - 'v*-sentinel'

permissions:
  contents: write

concurrency:
  group: nexus-sentinel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve and validate Sentinel tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = node -p "require('./package.json').version"
          $expected = "v$version-sentinel"
          if ($tag -ne $expected) { throw "Sentinel release tag '$tag' must equal '$expected'." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        run: npm ci

      - name: Validate full Sentinel roadmap source
        shell: pwsh
        run: |
          node --check main/entry.cjs
          node --check main/sentinel-scope-extension.cjs
          node --check main/sentinel-production-update-extension.cjs
          node --check main/sentinel-update-settings-bridge-extension.cjs
          node --check main/sentinel-lifecycle-extension.cjs
          node --check main/startup-smoke-evidence-extension.cjs
          node --check renderer/sentinel-scope.js
          node --check renderer/sentinel-navigation-guard.js
          node --check renderer/sentinel-roadmap.js
          node --check renderer/sentinel-live-copy.js
          node --check renderer/sentinel-update-ui.js
          node --check shared/sentinel-update-policy.cjs
          node --check scripts/write-sentinel-checksums.cjs

      - name: Run full Sentinel acceptance suite
        shell: pwsh
        run: |
          $tests = @(
            'test/sentinel-scope.test.cjs',
            'test/sentinel-roadmap-hardening.test.cjs',
            'test/sentinel-update-policy.test.cjs',
            'test/sentinel-production-update.test.cjs',
            'test/sentinel-update-settings-bridge.test.cjs',
            'test/palworld-rest.test.cjs',
            'test/server-client.test.cjs',
            'test/game-adapter-sdk.test.cjs',
            'test/player-console.test.cjs',
            'test/status-panels.test.cjs',
            'test/module-runtime-control.test.cjs',
            'test/application-monitor.test.cjs',
            'test/discord-auth.test.cjs',
            'test/discord-automation.test.cjs',
            'test/discord-automation-layout-edge.test.cjs',
            'test/discord-observability.test.cjs',
            'test/discord-observability-service.test.cjs',
            'test/discord-studio.test.cjs',
            'test/discord-studio-service.test.cjs',
            'test/redaction.test.cjs',
            'test/rcon-protocol.test.cjs',
            'test/rcon-guidance.test.cjs',
            'test/startup-health.test.cjs',
            'test/interface-watchdog.test.cjs',
            'test/window-visibility.test.cjs'
          )
          node --test --test-concurrency=1 $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Sentinel installer and portable executable
        run: npm run dist:win

      - name: Generate SHA-256 release manifest
        run: npm run sentinel:checksums

      - name: Verify release payload
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $required = @(
            "dist/Khaos-Nexus-Sentinel-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-Portable-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-$version-sha256.json"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing Sentinel release asset: $file" } }
          $manifest = Get-Content "dist/Khaos-Nexus-Sentinel-$version-sha256.json" -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'sentinel' -or $manifest.version -ne $version) { throw 'Sentinel release manifest identity is invalid.' }
          if (-not $manifest.assets."Khaos-Nexus-Sentinel-Setup-$version-x64.exe".sha256) { throw 'Installer digest is missing.' }
          if (-not $manifest.assets."Khaos-Nexus-Sentinel-Portable-$version-x64.exe".sha256) { throw 'Portable digest is missing.' }

      - name: Smoke-launch production Sentinel portable
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $portable = Get-ChildItem dist -Filter "Khaos-Nexus-Sentinel-Portable-$version-x64.exe" | Select-Object -First 1
          if (-not $portable) { throw 'Production Sentinel portable executable was not produced.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'nexus-sentinel-release-smoke.json'
          Remove-Item $evidence -Force -ErrorAction SilentlyContinue
          $env:KHAOS_PACKAGED_STARTUP_SMOKE = '1'
          $env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE = $evidence
          $env:KHAOS_DISABLE_UPDATE_NETWORK = '1'
          $process = Start-Process -FilePath $portable.FullName -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $state = $null
            $ui = $null
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $evidence) {
                try {
                  $payload = Get-Content $evidence -Raw | ConvertFrom-Json
                  $state = $payload.state
                  $ui = $payload.ui
                } catch {}
                if ($state -and $state.completed -and $ui -and $ui.ready) { break }
              }
              if ($process.HasExited) { throw "Production Sentinel exited before startup acceptance (exit $($process.ExitCode))." }
            }
            if (-not $state -or -not $state.completed) { throw 'Production Sentinel did not complete packaged startup health.' }
            $criticalFailures = @($state.checks | Where-Object { $_.critical -and $_.status -eq 'fail' })
            if ($criticalFailures.Count -gt 0) {
              $detail = ($criticalFailures | ForEach-Object { "$($_.id): $($_.detail)" }) -join '; '
              throw "Production Sentinel has critical startup failures: $detail"
            }
            if (-not $ui -or -not $ui.ready) { throw 'Production Sentinel final renderer acceptance failed.' }
            if ($ui.product -ne 'sentinel') { throw 'Production executable is not scoped as Sentinel.' }
            if ($ui.brandSubtitle -ne 'Discord + Palworld Control Center') { throw 'Production Sentinel branding is incorrect.' }
            if (-not $ui.updateSecurity) { throw 'Production Sentinel updater security panel did not render.' }
            if (@($ui.forbiddenVisible).Count -gt 0) { throw "Production Sentinel exposed deferred views: $(@($ui.forbiddenVisible) -join ', ')." }
          } finally {
            if ($process -and -not $process.HasExited) { taskkill /PID $process.Id /T /F 2>$null | Out-Null }
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:KHAOS_PACKAGED_STARTUP_SMOKE_FILE -ErrorAction SilentlyContinue
            Remove-Item Env:KHAOS_DISABLE_UPDATE_NETWORK -ErrorAction SilentlyContinue
          }

      - name: Create Sentinel GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $title = "Nexus Sentinel $version"
          $notes = @"
          Nexus Sentinel Windows release $version.

          Product scope: Discord + Palworld.
          Update channel: sentinel.
          Includes staged SHA-256 verified updates, background Sentinel-channel checks, verified pre-update backup, startup-health validation, and automatic rollback.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to overwrite a production Sentinel release." }
          $args = @(
            'release', 'create', $tag,
            "dist/Khaos-Nexus-Sentinel-Setup-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-Portable-$version-x64.exe",
            "dist/Khaos-Nexus-Sentinel-$version-sha256.json",
            '--title', $title,
            '--notes', $notes,
            '--latest=false'
          )
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $args += @('--target', '${{ github.sha }}')
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
