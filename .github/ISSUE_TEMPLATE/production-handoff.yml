name: Production handoff
description: Route a confirmed Khaos Nexus requirement to one production chat without duplicating work.
title: "[Handoff] "
labels:
  - "type:handoff"
  - "status:needs-inspection"
body:
  - type: markdown
    attributes:
      value: |
        Use this form only after Input and Routing confirms the requirement. GitHub is the work source of truth; the Architecture and Decisions Register is the decision source of truth. Production agents own engineering and evidence management. Owner participation is an exception limited to unresolved questions, physical/private execution, result reporting, and final approval.

  - type: input
    id: register_revision
    attributes:
      label: Register revision
      description: Current Architecture and Decisions Register revision, for example R5.
      placeholder: R5
    validations:
      required: true

  - type: input
    id: decision_ids
    attributes:
      label: Applicable decision IDs
      description: List the platform decision IDs that govern this work, or None.
      placeholder: ADR-001, ADR-005, ADR-006
    validations:
      required: true

  - type: input
    id: primary_chat
    attributes:
      label: Primary production chat
      description: Exact chat that owns implementation or validation.
      placeholder: Khaos Nexus Diagnostics
    validations:
      required: true

  - type: textarea
    id: secondary_chats
    attributes:
      label: Secondary chats requiring action
      description: List only chats that must do something. Write None when no additional handoff is required.
      placeholder: |
        - Release and CI — publish the approved test candidate
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Type
      options:
        - Feature
        - Bug
        - Decision
        - Research
        - Architecture change
        - Validation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Normal
        - High
        - Blocking
    validations:
      required: true

  - type: textarea
    id: requested_change
    attributes:
      label: Requested change
      description: State exactly what the assigned chat must change, inspect, repair, validate, or decide.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why it is needed
      description: Describe the user or production problem this solves.
    validations:
      required: true

  - type: textarea
    id: confirmed_requirements
    attributes:
      label: Confirmed requirements
      description: Include only confirmed requirements. Put suggestions in the separate field below.
    validations:
      required: true

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions
      description: Optional ideas that are not yet requirements.
      placeholder: None

  - type: textarea
    id: current_system
    attributes:
      label: Existing system inspection
      description: Record what currently works, what is incomplete or broken, and the evidence inspected. This must be completed before implementation begins.
      placeholder: |
        Working:
        Incomplete or broken:
        Evidence inspected:
    validations:
      required: true

  - type: input
    id: baseline
    attributes:
      label: Approved repository baseline
      description: Exact repository branch, pull request, and commit. Do not assume main is the application-code baseline.
      placeholder: agent/v0.24.0-installer-diagnostics @ 1cff97f... (PR #81)
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Important constraints
      description: Include compatibility, security, data preservation, ownership, release, no-rewrite, and Owner-participation constraints.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link prerequisite issues, pull requests, branches, decisions, or external repositories. Write None when there are none.
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: Define the observable completion state.
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Questions the assigned chat must resolve
      description: List unresolved implementation or ownership questions. These belong to the production agent unless an Owner question passes the ADR-006 exception gate. Write None if there are none.
    validations:
      required: true

  - type: dropdown
    id: owner_participation
    attributes:
      label: Owner participation expected
      description: Select the narrowest expected Owner role. This does not authorize asking the Owner before automated and repository-based work is exhausted.
      options:
        - None
        - Focused question only
        - Physical or private validation only
        - Final product or release approval only
        - Physical or private validation and final approval
    validations:
      required: true

  - type: textarea
    id: owner_question_gate
    attributes:
      label: Owner question gate
      description: If a focused Owner answer may be required, state what was inspected, why the answer cannot be resolved elsewhere, the exact question, known options, and the implementation or release impact. Otherwise write None.
      placeholder: None
    validations:
      required: true

  - type: textarea
    id: owner_test_session
    attributes:
      label: Owner test-session plan
      description: If physical/private execution may be required, state why, the approved distribution path, exact version/commit/artifact, checksum/signing evidence, backup/rollback state, short checklist, stop conditions, and evidence-return method. Otherwise write None.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Routing checks
      options:
        - label: I inspected the relevant existing repository state before routing this work.
          required: true
        - label: This issue has one primary owner and does not duplicate another active issue or pull request.
          required: true
        - label: Working systems, data, configuration, integrations, and user workflows must remain compatible.
          required: true
        - label: A rewrite is not authorized unless repository evidence proves repair or extension is impractical.
          required: true
        - label: Production agents own engineering, diagnostics, evidence interpretation, and GitHub coordination for this work.
          required: true
        - label: The Owner will not be asked to edit code, build locally, manage repository work, interpret CI/diagnostics, assemble releases, or determine defect ownership.
          required: true
        - label: Any Owner question or physical/private test will occur only after available evidence and automated validation are exhausted and the exact exception request is recorded.
          required: true
