; Astraeos-only Shiny! Dinos Ascended test profile for Nexus Anomaly validation.
; Project ID: 928548
; Keep Discord webhook secret in the live GameUserSettings.ini only; never commit it here.

[Shiny]
; Faster test cadence so spawn/tracker/notification behavior can be validated quickly.
SpawnIntervalMin=15m
SpawnIntervalMax=30m
DinoLifetimeMin=4h
DinoLifetimeMax=8h
DinoLevelMin=150
DinoLevelMax=180
MaxNumShinies=4
NumSearchLoops=15
RandomSelectionBias=0.2
CanCarryShinies=False
ShiniesUntameable=False

; Deliberately vague hunt information.
; Positive LocationPrecision values round coordinates; higher values reduce accuracy.
LocationPrecision=3
; Larger creatures can be blurred even further.
LocationPrecisionRange=2
RequireTracker=False
DisableTracker=False
DisableTrackerCoordinates=False
DisableDinoTracking=False

DinoBlacklist=
DinoWhitelist=
VariantBlacklist=
VariantWhitelist=
NoShinyFlyer=False
NoShinyAquatics=False
NoShinyUnrideables=False
NoActiveDuplicateDinos=True

; Spawn notices remain useful but do not reveal exact coordinates.
NotificationInterval=0
NotificationDuration=8.0
DisableNotifications=False
DisableNotificationCoordinates=True
NotificationNoDinoType=False
NotificationNoShinyVariant=False
TrackerNoDinoType=False
TrackerNoShinyVariant=False

VariantSwapChanceAberrant=0.03
VariantSwapChanceGenesis=0.03
SimpleVariantWeightSpecial=0.08
SimpleVariantWeightEnraged=0.03
SubVariantChance=0.03
StatBoostChance=0.05
StatBoostStrength=1.25

; Keep Tek unlock behavior disabled for this mechanics test until the desired Enraged-only chance model is finalized.
UnlockTekOnKill=False
TekNumUnlock=0
TekNumUnlockAlpha=0
EnragedLevelMultiplier=1.0

DisableEssenceExtraction=False
EssenceChanceSecond=0.25
EnragedRawEssenceRewardAmount=1
RadioactiveMutationBoost=1.0
TraitUpgradeChance=0.10
TraitGainChance=0.10

PopulateOnLoad=True
EnableUndermeshChecks=True
RunUndermeshStartupCheck=False
ActiveEvent=None
UseEventColors=True
UseEventVariants=True
TamedShowSparkles=False
DebugLogging=False

[ShinyDiscord]
; Paste the private Anomaly Response Network webhook into the live Astraeos GameUserSettings.ini.
WebhookURL="__PRIVATE_ASTRAEOS_ANOMALY_WEBHOOK__"
Username=Anomaly Response Network
AvatarURL=
UseEmbed=False
EmbedFooter=False
PatternSpawn=ANOMALY|ACTIVE|[Dino]|[Location]|[ServerName]|[MapName]
PatternDespawn=ANOMALY|DESPAWNED|[Dino]||[ServerName]|[MapName]
PatternTamed=ANOMALY|TAMED|[Dino]|[Player]|[ServerName]|[MapName]
PatternKilled=ANOMALY|KILLED|[Dino]|[Player]|[ServerName]|[MapName]
PatternKilledEssence=ANOMALY|KILLED|[Dino]|[Player]|[ServerName]|[MapName]
TitlePrefix=
TitleSpawn=
TitleDespawn=
TitleTamed=
TitleKilled=
FooterText=
