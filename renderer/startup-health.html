<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>Khaos Nexus Startup</title>
  <link rel="stylesheet" href="startup-health.css">
</head>
<body>
  <main class="startup-shell">
    <section class="startup-brand">
      <div class="sigil-wrap">
        <span class="sigil-ring ring-one"></span>
        <span class="sigil-ring ring-two"></span>
        <img src="../assets/icon.png" alt="Khaos Nexus">
      </div>
      <span class="eyebrow">Entering the Khaos Nexus</span>
      <h1>Khaos Nexus</h1>
      <p>Desktop Control Center</p>
    </section>

    <section class="startup-status" aria-live="polite">
      <div class="status-heading">
        <div>
          <span class="eyebrow">Protected startup</span>
          <h2 id="startupTitle">Preparing local profile</h2>
        </div>
        <strong id="startupPercent">0%</strong>
      </div>

      <div class="progress-track"><div id="startupProgress" class="progress-value"></div></div>
      <div class="progress-meta">
        <span id="startupDetail">Loading the same local data path used by v0.17.2…</span>
        <span id="startupCountdown">Minimum startup check: 30s</span>
      </div>

      <div id="startupChecks" class="check-list"></div>

      <section id="startupAttention" class="attention hidden">
        <strong>Startup needs attention</strong>
        <p id="startupAttentionText">One or more critical checks did not finish successfully.</p>
        <div class="actions">
          <button id="retryStartup" class="button primary" type="button">Retry Startup</button>
          <button id="openDataFolder" class="button" type="button">Open Data Folder</button>
          <button id="continueLimited" class="button" type="button">Open Limited Mode</button>
        </div>
      </section>
    </section>
  </main>
  <script src="startup-health.js"></script>
</body>
</html>
