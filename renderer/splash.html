<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khaos Nexus Startup</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #06070a; color: #f6f7fb; }
    body { display: grid; place-items: center; user-select: none; }
    body::before, body::after { content: ""; position: fixed; inset: -35%; pointer-events: none; }
    body::before { background: radial-gradient(circle, rgba(194, 18, 56, .24), transparent 46%); animation: breathe 3.4s ease-in-out infinite; }
    body::after { background: repeating-linear-gradient(115deg, transparent 0 34px, rgba(210, 24, 62, .025) 35px 36px); transform: rotate(-5deg); }
    .shell { position: relative; width: min(650px, calc(100vw - 48px)); min-height: 410px; padding: 30px 38px 26px; border: 1px solid rgba(230, 37, 78, .33); border-radius: 24px; background: linear-gradient(145deg, rgba(17, 19, 27, .98), rgba(7, 8, 12, .98)); box-shadow: 0 30px 85px rgba(0, 0, 0, .62), inset 0 0 45px rgba(160, 12, 43, .08); display: flex; flex-direction: column; align-items: center; transition: opacity .28s ease, transform .28s ease; }
    .shell::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border-top: 1px solid rgba(255, 87, 119, .34); pointer-events: none; }
    .logo-wrap { width: 132px; height: 132px; display: grid; place-items: center; position: relative; margin-top: 2px; }
    .logo-wrap::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: rgba(225, 24, 65, .28); filter: blur(24px); animation: pulse 2.5s ease-in-out infinite; }
    .logo { position: relative; width: 118px; height: 118px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(231, 37, 77, .42)); }
    h1 { margin: 6px 0 2px; font-size: 28px; letter-spacing: .16em; text-transform: uppercase; }
    .subtitle { margin: 0 0 25px; color: #aeb3c1; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    .status { min-height: 22px; margin: 0; font-size: 15px; color: #f0f1f5; text-align: center; }
    .detail { min-height: 18px; margin: 7px 0 20px; color: #8e95a7; font-size: 12px; text-align: center; max-width: 540px; }
    .progress-track { width: 100%; height: 10px; border-radius: 999px; background: #151821; border: 1px solid rgba(255,255,255,.05); overflow: hidden; box-shadow: inset 0 1px 5px rgba(0,0,0,.7); }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #8b0d2b, #e3264f, #ff5b7d); box-shadow: 0 0 20px rgba(227, 38, 79, .55); transition: width .32s ease; position: relative; }
    .progress-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 0 42%, rgba(255,255,255,.28) 50%, transparent 58%); animation: sweep 1.35s linear infinite; }
    .progress-meta { width: 100%; display: flex; justify-content: space-between; margin-top: 9px; color: #747c8d; font-size: 11px; }
    .error-panel { display: none; width: 100%; margin-top: 17px; }
    .error-panel.visible { display: block; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 14px; }
    button { appearance: none; border: 1px solid rgba(227,38,79,.5); border-radius: 10px; background: rgba(35, 12, 20, .88); color: #f8f8fb; padding: 9px 14px; font: 600 12px/1 "Segoe UI", sans-serif; cursor: pointer; }
    button:hover { background: rgba(83, 15, 32, .95); border-color: rgba(255,86,120,.8); }
    button.secondary { border-color: rgba(255,255,255,.16); background: rgba(255,255,255,.055); }
    details { margin-top: 13px; border: 1px solid rgba(255,255,255,.09); border-radius: 10px; background: rgba(0,0,0,.25); padding: 9px 12px; color: #b7bdca; font-size: 11px; user-select: text; }
    summary { cursor: pointer; font-weight: 600; color: #d5d8e0; }
    pre { max-height: 92px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; color: #a4aabb; }
    .footer { margin-top: auto; padding-top: 22px; color: #5f6675; font-size: 10px; letter-spacing: .08em; }
    body.complete .shell { opacity: 0; transform: scale(.985); }
    @keyframes pulse { 50% { transform: scale(1.12); opacity: .72; } }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .72; } }
    @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(110%); } }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <div class="logo-wrap"><img class="logo" src="../assets/icon.png" alt="Khaos Nexus logo"></div>
    <h1>Khaos Nexus</h1>
    <p class="subtitle">Desktop Control Center</p>
    <p class="status" id="statusText">Preparing Khaos Nexus…</p>
    <p class="detail" id="detailText">Securing the desktop application.</p>
    <div class="progress-track" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-meta"><span id="stageText">NOT STARTED</span><span id="progressText">0%</span></div>
    <section class="error-panel" id="errorPanel">
      <div class="actions">
        <button id="retryButton">Retry Startup</button>
        <button id="offlineButton">Open Offline</button>
        <button class="secondary" id="logsButton">Open Logs</button>
        <button class="secondary" id="exitButton">Exit</button>
      </div>
      <details><summary>View error details</summary><pre id="errorDetails"></pre></details>
    </section>
    <div class="footer" id="versionText">VERSION —</div>
  </main>
  <script>
    (() => {
      const api = window.khaosStartup;
      const statusText = document.getElementById('statusText');
      const detailText = document.getElementById('detailText');
      const stageText = document.getElementById('stageText');
      const progressText = document.getElementById('progressText');
      const progressBar = document.getElementById('progressBar');
      const progressTrack = document.getElementById('progressTrack');
      const errorPanel = document.getElementById('errorPanel');
      const errorDetails = document.getElementById('errorDetails');
      const versionText = document.getElementById('versionText');

      function render(state = {}) {
        const progress = Math.max(0, Math.min(100, Number(state.progress) || 0));
        statusText.textContent = state.message || 'Preparing Khaos Nexus…';
        detailText.textContent = state.status === 'failed' ? 'Startup stopped safely. Choose a recovery action below.' : (state.detail || 'Loading protected local services.');
        stageText.textContent = String(state.stage || 'starting').replace(/-/g, ' ').toUpperCase();
        progressText.textContent = Math.round(progress) + '%';
        progressBar.style.width = progress + '%';
        progressTrack.setAttribute('aria-valuenow', String(Math.round(progress)));
        versionText.textContent = 'VERSION ' + (state.version || '—');
        errorDetails.textContent = state.detail || 'No additional error details were provided.';
        errorPanel.classList.toggle('visible', state.status === 'failed');
        if (state.status === 'ready' || state.status === 'degraded') setTimeout(() => document.body.classList.add('complete'), 110);
      }

      document.getElementById('retryButton').addEventListener('click', () => api?.retry());
      document.getElementById('offlineButton').addEventListener('click', async () => {
        const result = await api?.openOffline();
        if (result && result.opened === false) detailText.textContent = result.reason || 'Offline mode is not available yet.';
      });
      document.getElementById('logsButton').addEventListener('click', () => api?.openLogs());
      document.getElementById('exitButton').addEventListener('click', () => api?.exit());
      api?.onState(render);
    })();
  </script>
</body>
</html>
