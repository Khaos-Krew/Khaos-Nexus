      <stop offset="0" stop-color="#ff8a48" stop-opacity=".42"/>
      <stop offset=".2" stop-color="#e22a42" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#5f0d24" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07080c" stop-opacity="0"/>
